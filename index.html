function handleDownloadArchive() {
  if (!window._archivedPeriods || window._archivedPeriods.length === 0) {
    alert("No archived periods yet. Periods older than one month will appear here.");
    return;
  }
  downloadArchive(window._archivedPeriods);
}

function downloadArchive(archivedPeriods) {
  const rows = [["Payday","Period","Total In","Total Bills","Lump Sum","Don't Go Below","Saved Balance Date","Saved Balance Amount"]];
  archivedPeriods.forEach(r => {
    const endDate = new Date(r.nextPayday.getTime() - 86400000);
    const range = `${MONTHS[r.payday.getMonth()]} ${r.payday.getDate()} – ${MONTHS[endDate.getMonth()]} ${endDate.getDate()}`;
    const paydayStr = r.payday.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });

    // Check if a saved balance falls within this period
    let savedDate = "", savedAmount = "";
    if (savedGroundTruth &&
        savedGroundTruth.date.getTime() >= r.payday.getTime() &&
        savedGroundTruth.date.getTime() < r.nextPayday.getTime()) {
      savedDate = savedGroundTruth.date.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
      savedAmount = Math.round(savedGroundTruth.amount);
    }

    rows.push([
      paydayStr, range,
      Math.round(r.totalIn),
      Math.round(r.totalBills),
      Math.round(r.lumpSum),
      Math.ceil((r.totalBills + BUFFER) / 100) * 100,
      savedDate,
      savedAmount
    ]);
  });
  const csv = rows.map(r => r.join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "archived_periods.csv";
  a.click();
}

function renderPeriods(periods) {
  const container = document.getElementById("periodsContainer");
  container.innerHTML = "";
  let currentMonth = null;
  let monthDiv = null;

  // Layout:
  // - Top: current month + next 4 months
  // - Bottom: previous month (faded)
  // - Archived: anything older than previous month
  const now = new Date();
  const thisMonth  = new Date(now.getFullYear(), now.getMonth(), 1);
  const prevMonth  = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const fwdLimit   = new Date(now.getFullYear(), now.getMonth() + 5, 1); // current + 4 more = 5 months ahead

  const archived = periods.filter(r => r.payday < prevMonth);
  const previous = periods.filter(r => r.payday >= prevMonth && r.payday < thisMonth);
  const current  = periods.filter(r => r.payday >= thisMonth && r.payday < fwdLimit);

  // Store archived for download
  if (archived.length > 0) window._archivedPeriods = archived;

  // Render current + next month first (top)
  current.forEach((r, idx) => {
    const m = r.payday.getMonth();
    const y = r.payday.getFullYear();
    const monthKey = `${y}-${m}`;

    if (monthKey !== currentMonth) {
      currentMonth = monthKey;
      monthDiv = document.createElement("div");
      monthDiv.className = "month-section";
      monthDiv.innerHTML = `<div class="month-label">${FULL_MONTHS[m]} ${y}</div>`;
      container.appendChild(monthDiv);
    }

    const isZero = r.lumpSum === 0;
    const endDate = new Date(r.nextPayday.getTime() - 86400000);

    const card = document.createElement("div");
    card.className = "period-card" + (r.isUpdatedPeriod ? " updated-period" : "");

    const dateRange = `${MONTHS[r.payday.getMonth()]} ${r.payday.getDate()} – ${MONTHS[endDate.getMonth()]} ${endDate.getDate()}`;
    const payDayStr = `${MONTHS[r.payday.getMonth()]} ${r.payday.getDate()}, ${r.payday.getFullYear()}`;

    const billRows = r.periodBills.map(b => `
      <div class="bill-row">
        <span class="bill-day">${ordinal(b.dueDay)}</span>
        <span class="bill-name">${b.name}</span>
        <span class="bill-amount">${fmt(b.amt)}</span>
      </div>
    `).join("");

    const incomeParts = [];
    if (r.yourPay > 0) incomeParts.push(`<span class="income-item">Your paycheck <strong>${fmt(r.yourPay)}</strong></span>`);
    if (r.partner > 0) incomeParts.push(`<span class="income-item">Partner deposit <strong>${fmt(r.partner)}</strong></span>`);

    card.innerHTML = `
      <div class="period-summary">
        <div class="period-date">
          ${payDayStr}
          <div class="sub">${dateRange}</div>
        </div>
        <div class="bills-col">
          <div class="label">Lowest Limit</div>
          <div class="amount" style="color:var(--red)">${fmt(Math.ceil((r.totalBills + BUFFER) / 100) * 100)}</div>
        </div>
        <div class="income-col">
          <div class="label">Income</div>
          <div class="amount">${fmt(r.totalIn)}</div>
        </div>
        <div class="bills-col">
          <div class="label">Bills</div>
          <div class="amount">${fmt(r.totalBills)}</div>
        </div>
        <div class="pullout-badge ${isZero ? "zero" : "available"}">
          ${isZero ? "Bills only period" : fmt(Math.round(r.lumpSum * 100) / 100)}
        </div>
        <span class="chevron" style="position:absolute;bottom:10px;right:1.25rem;font-size:10px;">
          Show Bills in Pay Period <span class="chevron-icon" style="font-size:13px;">⌄</span>
        </span>
      </div>
      <div class="period-detail">
        ${incomeParts.length > 0 ? `<div class="income-breakdown">
          ${incomeParts.join('<span style="color:var(--green);opacity:0.4">·</span>')}
          <span class="income-item" style="margin-left:auto">Total in: <strong>${fmt(r.totalIn)}</strong></span>
        </div>` : `<div class="income-breakdown" style="background:var(--blue-bg);color:var(--blue)">
          <span style="font-size:12px">Income &amp; bills before ${r.countFrom.toLocaleDateString("en-US",{month:"short",day:"numeric"})} already counted in your balance</span>
        </div>`}
        <div class="detail-header">
          <span>Bills this period</span>
          <span>Amount</span>
        </div>
        ${billRows}
        <div class="bill-total-row">
          <span class="total-label">Total bills</span>
          <span class="total-amount">${fmt(r.totalBills)}</span>
        </div>
        ${isZero ? `<div class="period-cover-note">This period's income is fully used by bills. Your prior period surplus covers the gap — don't pull anything out.</div>` : ""}
      </div>
    `;

    card.querySelector(".period-summary").addEventListener("click", () => {
      card.classList.toggle("open");
    });

    monthDiv.appendChild(card);

    // Inject test preview box if Test was hit and date is in this period
    if (testOverride && !savedGroundTruth &&
        testOverride.date.getTime() >= r.payday.getTime() &&
        testOverride.date.getTime() < r.nextPayday.getTime()) {
      const bwrap = document.createElement("div");
      bwrap.id = "baselineBox";
      bwrap.className = "baseline-box";
      bwrap.innerHTML = `
        <div class="baseline-card" id="baselineCard">
          <div class="baseline-header" id="baselineHeader"></div>
          <div class="baseline-row" id="baselineRow"></div>
        </div>`;
      monthDiv.appendChild(bwrap);
      renderBaselineContent(testOverride, r, true);
    }

    // Inject saved balance box if savedGroundTruth is in this period
    if (savedGroundTruth &&
        savedGroundTruth.date.getTime() >= r.payday.getTime() &&
        savedGroundTruth.date.getTime() < r.nextPayday.getTime()) {
      const bwrap = document.createElement("div");
      bwrap.id = "baselineBox";
      bwrap.className = "baseline-box";
      bwrap.innerHTML = `
        <div class="baseline-card" id="baselineCard">
          <div class="baseline-header" id="baselineHeader"></div>
          <div class="baseline-row" id="baselineRow"></div>
        </div>`;
      monthDiv.appendChild(bwrap);
      renderBaselineContent(savedGroundTruth, r, false);
    }
  });

  // Render previous month at the bottom
  if (previous.length > 0) {
    const divider = document.createElement("div");
    divider.style.cssText = "margin: 2rem 0 0.5rem; border-top: 0.5px solid var(--border); padding-top: 1.5rem;";
    container.appendChild(divider);

    let prevMonthDiv = null;
    let prevMonthKey = null;

    previous.forEach(r => {
      const m = r.payday.getMonth();
      const y = r.payday.getFullYear();
      const monthKey = `${y}-${m}`;

      if (monthKey !== prevMonthKey) {
        prevMonthKey = monthKey;
        prevMonthDiv = document.createElement("div");
        prevMonthDiv.className = "month-section";
        prevMonthDiv.innerHTML = `<div class="month-label" style="color:var(--text-hint);">${FULL_MONTHS[m]} ${y}</div>`;
        container.appendChild(prevMonthDiv);
      }

      const isZero = r.lumpSum === 0;
      const endDate = new Date(r.nextPayday.getTime() - 86400000);
      const card = document.createElement("div");
      card.className = "period-card";
      card.style.opacity = "0.6";
      const dateRange = `${MONTHS[r.payday.getMonth()]} ${r.payday.getDate()} – ${MONTHS[endDate.getMonth()]} ${endDate.getDate()}`;
      const payDayStr = `${MONTHS[r.payday.getMonth()]} ${r.payday.getDate()}, ${r.payday.getFullYear()}`;
      const billRows = r.periodBills.map(b => `
        <div class="bill-row">
          <span class="bill-day">${ordinal(b.dueDay)}</span>
          <span class="bill-name">${b.name}</span>
          <span class="bill-amount">${fmt(b.amt)}</span>
        </div>`).join("");
      const incomeParts = [];
      if (r.yourPay > 0) incomeParts.push(`<span class="income-item">Your paycheck <strong>${fmt(r.yourPay)}</strong></span>`);
      if (r.partner > 0) incomeParts.push(`<span class="income-item">Partner deposit <strong>${fmt(r.partner)}</strong></span>`);

      card.innerHTML = `
        <div class="period-summary">
          <div class="period-date">${payDayStr}<div class="sub">${dateRange}</div></div>
          <div class="bills-col"><div class="label">Lowest Limit</div><div class="amount" style="color:var(--red)">${fmt(Math.ceil((r.totalBills + BUFFER) / 100) * 100)}</div></div>
          <div class="income-col"><div class="label">Income</div><div class="amount">${fmt(r.totalIn)}</div></div>
          <div class="bills-col"><div class="label">Bills</div><div class="amount">${fmt(r.totalBills)}</div></div>
          <div class="pullout-badge ${isZero ? "zero" : "available"}">${isZero ? "Bills only" : fmt(Math.round(r.lumpSum))}</div>
          <span class="chevron">
          <span style="font-size:11px;color:var(--text-hint);">Show Bills</span>
          <span class="chevron-icon">⌄</span>
        </span>
        </div>
        <div class="period-detail">
          ${incomeParts.length > 0 ? `<div class="income-breakdown">${incomeParts.join('<span style="color:var(--green);opacity:0.4">·</span>')}<span class="income-item" style="margin-left:auto">Total in: <strong>${fmt(r.totalIn)}</strong></span></div>` : ""}
          <div class="detail-header" style="display:grid;grid-template-columns:1fr auto;padding:8px 1.25rem;background:var(--bg);font-size:11px;font-weight:600;color:var(--text-hint);text-transform:uppercase;letter-spacing:0.06em;"><span>Bills this period</span><span>Amount</span></div>
          ${billRows}
          <div class="bill-total-row"><span class="total-label">Total bills</span><span class="total-amount">${fmt(r.totalBills)}</span></div>
        </div>`;

      card.querySelector(".period-summary").addEventListener("click", () => card.classList.toggle("open"));
      prevMonthDiv.appendChild(card);
    });
  }
}

function switchTab(tab) {
  document.querySelectorAll(".tab-btn").forEach((b, i) => {
    const tabs = ["budget","bills","income"];
    b.classList.toggle("active", tabs[i] === tab);
  });
  document.querySelectorAll(".tab-panel").forEach(p => {
    p.classList.toggle("active", p.id === `tab-${tab}`);
  });
  if (tab === "bills") renderBillsTable();
  if (tab === "income") renderIncomeTable();
}

const FREQ_OPTIONS = [
  { value: "weekly",         label: "Weekly" },
  { value: "biweekly",       label: "Every other week" },
  { value: "monthly",        label: "Monthly" },
  { value: "bimonthly",      label: "Twice a month (1st & 15th)" },
  { value: "quarterly",      label: "Quarterly" },
  { value: "annually",       label: "Annually" },
  { value: "one_time",       label: "One-time" },
];

function renderBillsTable(keepOpen) {
  const container = document.getElementById("billsBody");
  const openPanels = new Set();
  document.querySelectorAll("[id^='bill-expand-']").forEach(el => {
    if (el.classList.contains("open")) openPanels.add(el.id);
  });
  container.innerHTML = "";
  const now = new Date();
  const sorted = BILLS.map((bill, idx) => ({ bill, idx }))
    .sort((a, b) => {
      const aExp = a.bill.endDate ? now > new Date(a.bill.endDate) : false;
      const bExp = b.bill.endDate ? now > new Date(b.bill.endDate) : false;
      if (aExp !== bExp) return aExp ? 1 : -1;
      return 0;
    });
  sorted.filter(({ bill }) => !bill.hidden).forEach(({ bill, idx }) => container.appendChild(buildBillRow(bill, idx)));
  const toOpen = keepOpen !== undefined ? new Set([`bill-expand-${keepOpen}`]) : openPanels;
  toOpen.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.add("open");
  });
}

function buildBillRow(bill, idx) {
  const freqOpts = FREQ_OPTIONS.map(o =>
    `<option value="${o.value}" ${bill.freq === o.value ? "selected" : ""}>${o.label}</option>`
  ).join("");

  const expandId = `bill-expand-${idx}`;
  const menuId   = `bill-menu-${idx}`;
  const amtPill  = `<span style="font-size:12px;font-weight:500;color:#0C447C;background:#E6F1FB;border-radius:20px;padding:3px 10px;border:0.5px solid #B5D4F4;">${fmt(bill.amt)}</span>`;

  const now = new Date();
  const billExpired = bill.endDate ? now > new Date(bill.endDate) : false;

  const card = document.createElement("div");
  card.className = "income-card" + (billExpired ? " expired" : "");
  card.draggable = true;
  card.dataset.idx = idx;
  card.addEventListener("dragstart", e => {
    e.dataTransfer.setData("text/plain", idx);
    e.dataTransfer.effectAllowed = "move";
    setTimeout(() => card.classList.add("dragging"), 0);
  });
  card.addEventListener("dragend", () => card.classList.remove("dragging"));
  card.addEventListener("dragover", e => { e.preventDefault(); card.classList.add("drag-over"); });
  card.addEventListener("dragleave", () => card.classList.remove("drag-over"));
  card.addEventListener("drop", e => {
    e.preventDefault();
    card.classList.remove("drag-over");
    const fromIdx = parseInt(e.dataTransfer.getData("text/plain"));
    const toIdx = parseInt(card.dataset.idx);
    if (fromIdx !== toIdx) {
      const moved = BILLS.splice(fromIdx, 1)[0];
      BILLS.splice(toIdx, 0, moved);
      renderBillsTable();
      refresh();
    }
  });
  card.innerHTML = `
    <div class="income-dots-wrap">
      <button class="income-dots-btn" onclick="event.stopPropagation();document.getElementById('${menuId}').classList.toggle('open');" aria-label="Options">&#8942;</button>
      <div class="income-dropdown" id="${menuId}">
        ${billExpired
          ? `<button onclick="toggleBillEdit(${idx})">Edit</button>
             <button onclick="hideBill(${idx})" style="color:var(--text-muted);">Hide</button>`
          : `<button onclick="deleteBill(${idx})">Delete</button>`}
      </div>
    </div>
    <div class="income-row-main" style="grid-template-columns:1fr auto auto;cursor:pointer;"
      onclick="if(!event.target.closest('.income-dots-wrap')&&event.target.tagName!=='BUTTON')document.getElementById('${expandId}').classList.toggle('open')">
      <div style="display:flex;align-items:center;">
        <input class="income-source-name" value="${bill.name}" ${billExpired && !bill.editing ? 'readonly style="pointer-events:none;"' : `readonly ondblclick="this.removeAttribute('readonly');if(this.value==='New Bill')this.value='';this.focus();event.stopPropagation();" onchange="updateBill(${idx},'name',this.value)" onblur="if(!this.value)this.value='New Bill';this.setAttribute('readonly',true)" onkeydown="if(event.key==='Enter')this.blur()"`} style="cursor:pointer;">
        ${billExpired ? '<span class="expired-badge">Archived</span>' : ''}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">${amtPill}</div>
      <span class="income-chevron">⌄</span>
    </div>
    <div class="income-expand" id="${expandId}">
      <div style="${billExpired && !bill.editing ? 'pointer-events:none;opacity:0.65;' : ''}">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.25rem;margin-bottom:1rem;">
        <div class="income-field">
          <span class="income-field-label">Amount</span>
          <div style="display:flex;align-items:center;gap:4px;">
            <span style="font-size:12px;color:var(--text-muted);">$</span>
            <input style="font-size:13px;border:0.5px solid var(--border-strong);border-radius:6px;padding:5px 8px;background:var(--surface);color:var(--text);width:100%;"
              type="text" inputmode="decimal"
              value="${bill.amt.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}"
              onfocus="if(parseFloat(this.value.replace(/,/g,''))===0)this.value=''"
              onchange="updateBill(${idx},'amt',parseFloat(this.value.replace(/,/g,'')))"
              oninput="liveFormatAmount(this)">
          </div>
        </div>
        <div class="income-field">
          <span class="income-field-label">Due Day</span>
          <select style="font-size:13px;border:0.5px solid var(--border-strong);border-radius:6px;padding:5px 8px;background:var(--surface);color:var(--text);width:100%;"
            onchange="updateBill(${idx},'day',parseInt(this.value))">
            ${Array.from({length:31},(_,i)=>{const d=i+1;return `<option value="${d}" ${bill.days[0]===d?"selected":""}>${ordinal(d)}</option>`;}).join("")}
          </select>
        </div>
        <div class="income-field">
          <span class="income-field-label">Frequency</span>
          <select style="font-size:13px;border:0.5px solid var(--border-strong);border-radius:6px;padding:5px 8px;background:var(--surface);color:var(--text);width:100%;"
            onchange="updateBill(${idx},'freq',this.value)">${freqOpts}</select>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1rem;">
        <div class="income-field">
          <span class="income-field-label">Start Date</span>
          <input style="font-size:13px;border:0.5px solid var(--border-strong);border-radius:6px;padding:5px 8px;background:var(--surface);color:var(--text);width:100%;"
            type="date" value="${bill.startDate||''}"
            onchange="updateBill(${idx},'startDate',this.value)">
        </div>
        <div class="income-field">
          <span class="income-field-label">End Date</span>
          <input type="text" inputmode="none"
            value="${bill.endDate||'Ongoing'}"
            style="font-size:13px;border:0.5px solid var(--border-strong);border-radius:6px;padding:5px 8px;background:var(--surface);color:${bill.endDate?'var(--text)':'var(--text-muted)'};width:100%;"
            onfocus="this.type='date';this.value='${bill.endDate||''}';this.style.color='var(--text)';"
            onblur="if(!this.value){updateBill(${idx},'endDate','');this.type='text';this.value='Ongoing';this.style.color='var(--text-muted)';} else {updateBill(${idx},'endDate',this.value);}"
            onchange="updateBill(${idx},'endDate',this.value)">
        </div>
      </div>
      </div>
      <div style="display:flex;justify-content:flex-end;padding-top:10px;">
        <button onclick="saveToStorage();showSavedToast();this.closest('.income-expand').classList.remove('open')"
          style="font-size:12px;padding:5px 16px;border-radius:6px;border:0.5px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer;font-weight:500;">Save</button>
      </div>

    </div>`;

  document.addEventListener("click", () => {
    const menu = document.getElementById(menuId);
    if (menu) menu.classList.remove("open");
  });

  return card;
}

function updateBill(idx, field, value) {
  if (field === "name")           BILLS[idx].name = value;
  else if (field === "amt")       { BILLS[idx].amt = isNaN(value) ? BILLS[idx].amt : value; renderBillsTable(idx); }
  else if (field === "day")       { BILLS[idx].days = [value]; renderBillsTable(idx); }
  else if (field === "startDate") BILLS[idx].startDate = value;
  else if (field === "endDate")   { BILLS[idx].endDate = value; renderBillsTable(idx); }
  else if (field === "freq")      { BILLS[idx].freq = value; renderBillsTable(idx); }
  refresh();
}

function deleteBill(idx) {
  BILLS.splice(idx, 1);
  renderBillsTable();
  refresh();
}

function hideBill(idx) {
  BILLS[idx].hidden = true;
  renderBillsTable();
}

function toggleBillEdit(idx) {
  BILLS[idx].editing = !BILLS[idx].editing;
  renderBillsTable(idx);
  // Open the expand panel
  const el = document.getElementById(`bill-expand-${idx}`);
  if (el) el.classList.add("open");
}

function addBillRow() {
  BILLS.push({ name: "New Bill", days: [1], amt: 0, freq: "monthly", startDate: "" });
  const newIdx = BILLS.length - 1;
  renderBillsTable(newIdx);
  const tryOpen = () => {
    const expandEl = document.getElementById(`bill-expand-${newIdx}`);
    if (expandEl) {
      expandEl.classList.add("open");
      expandEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  };
  tryOpen();
  setTimeout(tryOpen, 100);
  setTimeout(tryOpen, 300);
}

// ── Income data ──────────────────────────────────────────────────────────
const INCOME_FREQ_OPTIONS = [
  { value: "biweekly",    label: "Every other week" },
  { value: "weekly",      label: "Weekly" },
  { value: "monthly",     label: "Monthly (fixed day)" },
  { value: "semimonthly", label: "Twice a month (1st & 15th)" },
  { value: "one_time",    label: "One-time" },
];

// amounts = array of values that cycle in order each occurrence
let INCOME_SOURCES = [];

function incomeOnDate(dt) {
  let total = 0;
  INCOME_SOURCES.forEach(src => {
    if (!src.startDate) return;
    const [sy,sm,sd] = src.startDate.split("-").map(Number);
    const start = new Date(sy, sm-1, sd);
    if (dt < start) return;
    if (isExpired(src, dt)) return;
    const amts = src.amounts && src.amounts.length ? src.amounts : [0];
    let occurrenceIndex = -1;

    if (src.freq === "biweekly") {
      const diff = Math.round((dt - start) / 86400000);
      if (diff >= 0 && diff % 14 === 0) occurrenceIndex = Math.floor(diff / 14);
    } else if (src.freq === "weekly") {
      const diff = Math.round((dt - start) / 86400000);
      if (diff >= 0 && diff % 7 === 0) occurrenceIndex = Math.floor(diff / 7);
    } else if (src.freq === "monthly") {
      const day = sd;
      if (dt.getDate() === day) {
        occurrenceIndex = (dt.getFullYear() - sy) * 12 + (dt.getMonth() + 1 - sm);
      }
    } else if (src.freq === "semimonthly") {
      if (dt.getDate() === 1 || dt.getDate() === 15) occurrenceIndex = 1;
    } else if (src.freq === "one_time") {
      if (dt.getFullYear()===sy && dt.getMonth()+1===sm && dt.getDate()===sd) occurrenceIndex = 0;
    }

    if (occurrenceIndex >= 0) {
      const seq = src.sequence && src.sequence.length ? src.sequence : amts.map((_,i) => i);
      const seqIdx = occurrenceIndex % seq.length;
      const amtIdx = seq[seqIdx];
      total += amts[amtIdx] || 0;
    }
  });
  return total;
}

function renderIncomeTable(keepOpen) {
  const container = document.getElementById("incomeBody");
  const openPanels = new Set();
  document.querySelectorAll("[id^='income-expand-']").forEach(el => {
    if (el.classList.contains("open")) openPanels.add(el.id);
  });
  container.innerHTML = "";
  const now = new Date();
  const sorted = INCOME_SOURCES.map((src, idx) => ({ src, idx }))
    .sort((a, b) => {
      const aExp = a.src.endDate ? now > new Date(a.src.endDate) : false;
      const bExp = b.src.endDate ? now > new Date(b.src.endDate) : false;
      if (aExp !== bExp) return aExp ? 1 : -1;
      return 0;
    });
  sorted.filter(({ src }) => !src.hidden).forEach(({ src, idx }) => container.appendChild(buildIncomeRow(src, idx)));
  const toOpen = keepOpen !== undefined ? new Set([`income-expand-${keepOpen}`]) : openPanels;
  toOpen.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.add("open");
  });
}

function buildIncomeRow(src, idx) {
  const amounts  = src.amounts  && src.amounts.length  ? src.amounts  : [0];
  const amtNames = src.amtNames && src.amtNames.length ? src.amtNames : amounts.map((_,i) => `Amount ${String.fromCharCode(65+i)}`);
  const sequence = src.sequence && src.sequence.length ? src.sequence : [0];
  const freqOpts = INCOME_FREQ_OPTIONS.map(o =>
    `<option value="${o.value}" ${src.freq === o.value ? "selected" : ""}>${o.label}</option>`
  ).join("");

  const hasPattern = amounts.length > 1;
  const pills = amounts.map((a, ai) =>
    `<span style="font-size:12px;font-weight:500;color:#0C447C;background:#E6F1FB;border-radius:20px;padding:3px 10px;border:0.5px solid #B5D4F4;">${fmt(a)}</span>`
  ).join(" ");

  const expandId = `income-expand-${idx}`;
  const menuId   = `income-menu-${idx}`;

  // Amount rows
  const amtRows = amounts.map((amt, ai) => `
    <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--border);">
      <input style="font-size:12px;font-weight:600;color:var(--text);border:none;background:transparent;outline:none;width:80px;border-bottom:1px solid transparent;"
        value="${amtNames[ai]}" onchange="updateIncomeAmtName(${idx},${ai},this.value)"
        onfocus="this.style.borderBottomColor='var(--border-strong)'" onblur="this.style.borderBottomColor='transparent'">
      <span style="font-size:12px;color:var(--text-muted);">$</span>
      <input style="font-size:13px;border:0.5px solid var(--border);border-radius:6px;padding:3px 8px;background:var(--surface);color:var(--text);outline:none;width:110px;"
        type="text" inputmode="decimal"
        value="${amt.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}"
        oninput="liveFormatAmount(this);updateIncomeAmt(${idx},${ai},parseFloat(this.value.replace(/,/g,'')))"
        onchange="updateIncomeAmt(${idx},${ai},parseFloat(this.value.replace(/,/g,'')))"
        onfocus="if(parseFloat(this.value.replace(/,/g,''))===0)this.value='';this.style.borderColor='var(--blue)'" onblur="this.style.borderColor='var(--border)'">
      ${amounts.length > 1 ? `<button onclick="removeIncomeAmt(${idx},${ai})" style="background:none;border:none;color:var(--text-hint);cursor:pointer;font-size:13px;padding:0 4px;">✕</button>` : ""}
    </div>`).join("");

  // Flow steps
  const flowSteps = sequence.map((amtIdx, si) => {
    const seqOpts = amtNames.map((n, ni) =>
      `<option value="${ni}" ${ni === amtIdx ? "selected" : ""}>${n}</option>`
    ).join("");
    const isLast = si === sequence.length - 1;
    return `
      <div style="display:flex;flex-direction:column;align-items:flex-start;">
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="font-size:11px;color:var(--text-hint);min-width:44px;">Step ${si+1}</span>
          <select style="font-size:12px;font-weight:500;color:#0C447C;background:#E6F1FB;border:0.5px solid #B5D4F4;border-radius:8px;padding:5px 10px;cursor:pointer;"
            onchange="updateIncomeSeq(${idx},${si},parseInt(this.value))">${seqOpts}</select>
          <button onclick="removeIncomeSeq(${idx},${si})" style="background:none;border:none;color:var(--text-hint);cursor:pointer;font-size:13px;padding:0 4px;">✕</button>
        </div>
        ${!isLast ? '<div style="margin-left:50px;padding:3px 0;"><span style="font-size:14px;color:var(--text-hint);">↓</span></div>' : ""}
      </div>`;
  }).join("");

  const now = new Date();
  const srcExpired = src.endDate ? now > new Date(src.endDate) : false;

  const card = document.createElement("div");
  card.className = "income-card" + (srcExpired ? " expired" : "");
  card.draggable = true;
  card.dataset.idx = idx;
  card.addEventListener("dragstart", e => {
    e.dataTransfer.setData("text/plain", idx);
    e.dataTransfer.effectAllowed = "move";
    setTimeout(() => card.classList.add("dragging"), 0);
  });
  card.addEventListener("dragend", () => card.classList.remove("dragging"));
  card.addEventListener("dragover", e => { e.preventDefault(); card.classList.add("drag-over"); });
  card.addEventListener("dragleave", () => card.classList.remove("drag-over"));
  card.addEventListener("drop", e => {
    e.preventDefault();
    card.classList.remove("drag-over");
    const fromIdx = parseInt(e.dataTransfer.getData("text/plain"));
    const toIdx = parseInt(card.dataset.idx);
    if (fromIdx !== toIdx) {
      const moved = INCOME_SOURCES.splice(fromIdx, 1)[0];
      INCOME_SOURCES.splice(toIdx, 0, moved);
      renderIncomeTable();
      refresh();
    }
  });
  card.innerHTML = `
    <div class="income-dots-wrap">
      <button class="income-dots-btn" onclick="event.stopPropagation();document.getElementById('${menuId}').classList.toggle('open');" aria-label="Options">&#8942;</button>
      <div class="income-dropdown" id="${menuId}">
        ${srcExpired
          ? `<button onclick="toggleIncomeEdit(${idx})">Edit</button>
             <button onclick="hideIncome(${idx})" style="color:var(--text-muted);">Hide</button>`
          : `<button onclick="deleteIncome(${idx})">Delete</button>`}
      </div>
    </div>
    <div class="income-row-main" style="grid-template-columns:1fr auto auto;cursor:pointer;"
      onclick="if(!event.target.closest('.income-dots-wrap')&&event.target.tagName!=='BUTTON')document.getElementById('${expandId}').classList.toggle('open')">
      <div style="display:flex;align-items:center;">
        <input class="income-source-name" value="${src.source}" ${srcExpired && !src.editing ? 'readonly style="pointer-events:none;"' : `readonly ondblclick="this.removeAttribute('readonly');if(this.value==='New Income')this.value='';this.focus();event.stopPropagation();" onchange="updateIncome(${idx},'source',this.value)" onblur="if(!this.value)this.value='New Income';this.setAttribute('readonly',true)" onkeydown="if(event.key==='Enter')this.blur()"`} style="cursor:pointer;">
        ${srcExpired ? '<span class="expired-badge">Archived</span>' : ''}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-start;">${pills}</div>
      <span class="income-chevron">⌄</span>
    </div>
    <div class="income-expand" id="${expandId}">
      <div style="${srcExpired && !src.editing ? 'pointer-events:none;opacity:0.65;' : ''}">
      <div class="income-pattern-grid">
        <div>
          <div class="income-field-label" style="margin-bottom:8px;">Amounts</div>
          ${amtRows}
          <button onclick="addIncomeAmt(${idx})" style="font-size:12px;padding:4px 10px;border-radius:6px;border:0.5px solid var(--border-strong);background:transparent;color:var(--text-muted);cursor:pointer;margin-top:8px;">+ add amount</button>
        </div>
        <div>
          <div class="income-field-label" style="margin-bottom:8px;">Pattern <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:10px;color:var(--text-hint);margin-left:4px;">repeats after last step</span></div>
          <div style="display:flex;flex-direction:column;align-items:flex-start;">${flowSteps}</div>
          <div style="margin-left:50px;padding:3px 0;"><span style="font-size:14px;color:var(--text-hint);">↓</span></div>
          <div style="margin-left:50px;font-size:10px;color:var(--text-hint);background:var(--surface);border:0.5px dashed var(--border-strong);border-radius:4px;padding:3px 8px;display:inline-block;">↩ repeat</div>
          <button onclick="addIncomeSeq(${idx})" style="display:block;margin-top:10px;font-size:12px;padding:4px 12px;border-radius:8px;border:0.5px solid var(--border-strong);background:transparent;color:var(--text-muted);cursor:pointer;">+ add step</button>
        </div>
      </div>
      <hr style="border:none;border-top:0.5px solid var(--border);margin:1.25rem 0;">
      <div class="income-expand-grid">
        <div class="income-field">
          <span class="income-field-label">Frequency</span>
          <select onchange="updateIncome(${idx},'freq',this.value)">${freqOpts}</select>
        </div>
        <div class="income-field">
          <span class="income-field-label">Period</span>
          <div style="display:flex;flex-direction:column;gap:6px;">
            <div style="display:flex;align-items:center;gap:6px;">
              <span style="font-size:11px;color:var(--text-hint);min-width:32px;">From</span>
              <input type="date" value="${src.startDate||''}" style="font-size:13px;border:0.5px solid var(--border-strong);border-radius:6px;padding:5px 8px;background:var(--surface);color:var(--text);width:100%;" onchange="updateIncome(${idx},'startDate',this.value)">
            </div>
            <div style="display:flex;align-items:center;gap:6px;">
              <span style="font-size:11px;color:var(--text-hint);min-width:32px;">To</span>
              <input type="text" inputmode="none"
                value="${src.endDate || 'Ongoing'}"
                style="font-size:13px;border:0.5px solid var(--border-strong);border-radius:6px;padding:5px 8px;background:var(--surface);color:${src.endDate ? 'var(--text)' : 'var(--text-muted)'};width:100%;"
                onfocus="this.type='date';this.value='${src.endDate||''}';this.style.color='var(--text)';"
                onblur="if(!this.value){updateIncome(${idx},'endDate','');this.type='text';this.value='Ongoing';this.style.color='var(--text-muted)';} else {updateIncome(${idx},'endDate',this.value);}"
                onchange="updateIncome(${idx},'endDate',this.value)">
            </div>
          </div>
        </div>
      </div>
      </div>
      <div style="display:flex;justify-content:flex-end;padding-top:10px;">
        <button onclick="saveToStorage();showSavedToast();this.closest('.income-expand').classList.remove('open')"
          style="font-size:12px;padding:5px 16px;border-radius:6px;border:0.5px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer;font-weight:500;">Save</button>
      </div>

    </div>`;

  // Close menu on outside click
  document.addEventListener("click", () => {
    const menu = document.getElementById(menuId);
    if (menu) menu.classList.remove("open");
  });

  return card;
}

function toggleIncomeExpand(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle("open");
}

function toggleIncomeOngoing(idx) {
  const src = INCOME_SOURCES[idx];
  const ted = new Date(); ted.setFullYear(ted.getFullYear() + 1);
  src.endDate = src.endDate ? "" : `${ted.getFullYear()}-${String(ted.getMonth()+1).padStart(2,"0")}-${String(ted.getDate()).padStart(2,"0")}`;
  renderIncomeTable();
  refresh();
}

function updateIncome(idx, field, value) {
  INCOME_SOURCES[idx][field] = value;
  if (["freq","endDate","startDate"].includes(field)) renderIncomeTable(idx);
  refresh();
}

function updateIncomeAmt(idx, ai, value) {
  if (!isNaN(value) && value >= 0) {
    INCOME_SOURCES[idx].amounts[ai] = value;
    // Update pills in banner without full re-render
    const card = document.getElementById(`income-expand-${idx}`)?.closest('.income-card');
    if (card) {
      const amounts = INCOME_SOURCES[idx].amounts;
      const amtNames = INCOME_SOURCES[idx].amtNames || amounts.map((_,i) => `Amount ${String.fromCharCode(65+i)}`);
      const hasPattern = amounts.length > 1;
      const pillsEl = card.querySelector('.income-row-main > div:nth-child(2)');
      if (pillsEl) {
        pillsEl.innerHTML = amounts.map((a, i) =>
          `<span style="font-size:12px;font-weight:500;color:#0C447C;background:#E6F1FB;border-radius:20px;padding:3px 10px;border:0.5px solid #B5D4F4;">${fmt(a)}</span>`
        ).join(" ");
      }
    }
    refresh();
  }
}

function updateIncomeAmtName(idx, ai, value) {
  if (!INCOME_SOURCES[idx].amtNames) INCOME_SOURCES[idx].amtNames = [];
  INCOME_SOURCES[idx].amtNames[ai] = value;
  // Update sequence dropdowns in-place without full re-render
  const seqContainer = document.getElementById(`income-expand-${idx}`);
  if (seqContainer) {
    seqContainer.querySelectorAll('select').forEach(sel => {
      Array.from(sel.options).forEach((opt, ni) => {
        if (INCOME_SOURCES[idx].amtNames[ni]) opt.text = INCOME_SOURCES[idx].amtNames[ni];
      });
    });
  }
}

function addIncomeAmt(idx) {
  const src = INCOME_SOURCES[idx];
  const nextLetter = String.fromCharCode(65 + src.amounts.length);
  src.amounts.push(0);
  if (!src.amtNames) src.amtNames = [];
  src.amtNames.push(`Amount ${nextLetter}`);
  if (!src.sequence) src.sequence = [0];
  src.sequence.push(src.amounts.length - 1);
  renderIncomeTable(idx);
  refresh();
}

function removeIncomeAmt(idx, ai) {
  const src = INCOME_SOURCES[idx];
  src.amounts.splice(ai, 1);
  if (src.amtNames) src.amtNames.splice(ai, 1);
  if (src.sequence) {
    src.sequence = src.sequence.filter(s => s !== ai).map(s => s > ai ? s - 1 : s);
  }
  renderIncomeTable(idx);
  refresh();
}

function addIncomeSeq(idx) {
  if (!INCOME_SOURCES[idx].sequence) INCOME_SOURCES[idx].sequence = [0];
  INCOME_SOURCES[idx].sequence.push(0);
  renderIncomeTable(idx);
}

function removeIncomeSeq(idx, si) {
  INCOME_SOURCES[idx].sequence.splice(si, 1);
  renderIncomeTable(idx);
}

function updateIncomeSeq(idx, si, amtIdx) {
  INCOME_SOURCES[idx].sequence[si] = amtIdx;
  refresh();
}

function deleteIncome(idx) {
  INCOME_SOURCES.splice(idx, 1);
  renderIncomeTable();
  refresh();
}

function hideIncome(idx) {
  INCOME_SOURCES[idx].hidden = true;
  renderIncomeTable();
}

function toggleIncomeEdit(idx) {
  INCOME_SOURCES[idx].editing = !INCOME_SOURCES[idx].editing;
  renderIncomeTable(idx);
}

function addIncomeRow() {
  const td = new Date(); const tds = `${td.getFullYear()}-${String(td.getMonth()+1).padStart(2,"0")}-${String(td.getDate()).padStart(2,"0")}`;
  INCOME_SOURCES.push({ source: "New Income", freq: "biweekly", startDate: tds, endDate: "",
    amounts: [0], amtNames: ["Amount A"], sequence: [0] });
  const newIdx = INCOME_SOURCES.length - 1;
  renderIncomeTable(newIdx);
  // Try immediately and also with delay as fallback
  const tryOpen = () => {
    const expandEl = document.getElementById(`income-expand-${newIdx}`);
    if (expandEl) {
      expandEl.classList.add("open");
      expandEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  };
  tryOpen();
  setTimeout(tryOpen, 100);
  setTimeout(tryOpen, 300);
}

function refresh() {
  const periods = computePeriods();
  renderPeriods(periods);
}

// ── localStorage persistence ──────────────────────────────────────────────
const LS_KEY = "payday_budget_v1";

function showSavedToast() {
  const t = document.getElementById("savedToast");
  if (!t) return;
  t.style.display = "block";
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.display = "none", 2000);
}

function saveToStorage() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      BILLS, INCOME_SOURCES, BUFFER,
      savedGroundTruth: savedGroundTruth
        ? { date: savedGroundTruth.date.toISOString(), amount: savedGroundTruth.amount }
        : null,
    }));
  } catch(e) { console.warn("Could not save:", e); }
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (Array.isArray(data.BILLS)) {
      BILLS = data.BILLS.map(b => {
        if (['quarterly_may','quarterly_jun','quarterly_jul'].includes(b.freq)) {
          return { ...b, freq: 'quarterly' };
        }
        return b;
      });
    }
    if (Array.isArray(data.INCOME_SOURCES)) INCOME_SOURCES = data.INCOME_SOURCES;
    if (typeof data.BUFFER === "number") {
      BUFFER = data.BUFFER;
      const inp = document.getElementById("bufferInput");
      if (inp) inp.value = BUFFER.toLocaleString("en-US");
    }
    if (data.savedGroundTruth) {
      savedGroundTruth = {
        date: new Date(data.savedGroundTruth.date),
        amount: data.savedGroundTruth.amount
      };
      balanceOverride = { ...savedGroundTruth };
    }
    return true;
  } catch(e) { console.warn("Could not load:", e); return false; }
}

function showWelcome() {
  const container = document.getElementById("periodsContainer");
  if (!container) return;
  container.innerHTML = `
    <div style="text-align:center;padding:4rem 2rem;color:var(--text-muted);">
      <div style="font-size:48px;margin-bottom:1rem;">💰</div>
      <h2 style="font-size:20px;font-weight:500;color:var(--text);margin-bottom:0.5rem;">Welcome to Payday Budget Calculator</h2>
      <p style="font-size:14px;margin-bottom:2rem;">Add your income sources and bills to get started, then set your current balance.</p>
      <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
        <button onclick="switchTab('income');setTimeout(addIncomeRow,100);" style="font-size:13px;padding:10px 20px;border-radius:8px;border:0.5px solid #185fa5;background:#e6f1fb;color:#185fa5;cursor:pointer;font-weight:500;">Add Income →</button>
        <button onclick="switchTab('bills');setTimeout(addBillRow,100);" style="font-size:13px;padding:10px 20px;border-radius:8px;border:0.5px solid #6c3483;background:#f0e6f6;color:#6c3483;cursor:pointer;font-weight:500;">Add Bills →</button>
        <button onclick="document.getElementById('bufferInput').focus();document.getElementById('bufferInput').select();" style="font-size:13px;padding:10px 20px;border-radius:8px;border:0.5px solid var(--green-dark);background:var(--green-bg);color:var(--green-dark);cursor:pointer;font-weight:500;">Add Buffer →</button>
      </div>
    </div>`;
}

// Init date picker to today
(function initDatePicker() {
  const el = document.getElementById("balanceDate");
  if (!el) return;
  const t = new Date();
  const y = t.getFullYear();
  const m = String(t.getMonth()+1).padStart(2,"0");
  const d = String(t.getDate()).padStart(2,"0");
  el.value = `${y}-${m}-${d}`;
  el.min = `${y}-01-01`;
  el.max = `${y+2}-12-31`;
})();

// Load saved data then render
const _hasData = loadFromStorage();
refresh();
if (!_hasData && BILLS.length === 0 && INCOME_SOURCES.length === 0) {
  showWelcome();
}
</script>
