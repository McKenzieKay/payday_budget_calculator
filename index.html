<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payday Budget Calculator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Abril+Fatface&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* Color palette inspired by sage / tan / chartreuse / royal blue / dark brown */
    --bg: #f6f2e9;                          /* warm cream */
    --surface: #ffffff;
    --border: rgba(142, 142, 118, 0.2);     /* sage-tinted */
    --border-strong: rgba(142, 142, 118, 0.4);
    --text: #2a2010;                        /* dark brown */
    --text-muted: #6e6e5e;
    --text-hint: #9c9a85;
    --green-bg: #eef2d6;                    /* light chartreuse */
    --green: #6a7d1f;                       /* olive */
    --blue-bg: #e3e8f4;                     /* pale royal */
    --blue: #1f3da4;                        /* royal blue */
    --red-bg: #f2dad6;
    --red: #8a2820;
    --chartreuse-dark: #5a6010;
    --radius: 0px;
    --radius-sm: 0px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --surface: #242424;
      --border: rgba(255,255,255,0.1);
      --border-strong: rgba(255,255,255,0.2);
      --text: #f0f0f0;
      --text-muted: #aaa;
      --text-hint: #777;
      --green-bg: #173404;
      --green: #97c459;
      --blue-bg: #042c53;
      --blue: #85b7eb;
      --red-bg: #501313;
      --red: #f09595;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  .tab-bar {
    display: flex;
    align-items: center;
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    padding: 0 1.5rem;
    gap: 0;
  }
  .tab-bar-buffer {
    margin-left: auto;
    display: flex;
    align-items: center;
    height: 32px;
    border: 0.5px solid var(--border-strong);
    background: var(--surface);
    padding: 0 10px;
    gap: 4px;
  }
  .tab-bar-buffer span.lbl {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    user-select: none;
  }
  .tab-bar-buffer span.dollar { font-size: 13px; color: var(--text-muted); user-select: none; }
  .tab-bar-buffer input {
    width: 60px;
    font-size: 13px;
    font-weight: 600;
    border: none;
    background: transparent;
    color: var(--text);
    padding: 0;
    text-align: right;
    outline: none;
  }

  .tab-btn {
    font-size: 13px;
    font-weight: 500;
    padding: 10px 18px;
    border: none;
    background: none;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -0.5px;
    transition: color 0.15s;
  }

  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--blue); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .add-bill-btn {
    margin: 1rem 0;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    font-weight: 500;
  }

  .add-bill-btn:hover { background: var(--blue-bg); color: var(--blue); border-color: var(--blue); }

  .bills-panel-wrap { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem; }

  .income-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    position: relative;
    overflow: visible;
  }

  .income-row-main:hover { background: #fdfdfa; }

  /* Unified amount pill — uses Budget palette (warm cream / sage / dark brown) */
  .amt-pill {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    background: var(--bg);
    border: 0.5px solid var(--border-strong);
    border-radius: 4px;
    padding: 3px 10px;
    display: inline-block;
  }
  .amt-pill.select-like {
    cursor: pointer;
    padding: 5px 10px;
    border-radius: 4px;
  }

  .income-card.expired {
    opacity: 0.45;
  }

  .income-card[draggable="true"] { cursor: grab; }
  .income-card[draggable="true"]:active { cursor: grabbing; }
  .income-card.drag-over { border: 1.5px dashed var(--blue); background: var(--blue-bg); }
  .income-card.dragging { opacity: 0.4; }

  .income-card .income-chevron {
    font-size: 18px;
    color: var(--text-hint);
    line-height: 1;
    padding: 0 4px;
    transition: transform 0.2s;
    display: inline-block;
  }

  .income-card .income-expand.open ~ * .income-chevron,
  .income-card:has(.income-expand.open) .income-chevron { transform: rotate(180deg); }

  .expired-badge {
    font-size: 10px;
    color: var(--text-hint);
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    margin-left: 8px;
  }

  .income-row-main {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    align-items: center;
    gap: 1rem;
    padding: 12px 42px 12px 16px;
  }

  .income-source-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    border: none;
    background: transparent;
    outline: none;
    width: 100%;
    max-width: 33%;
  }

  .income-source-name:focus { outline: none; }

  .income-dots-wrap { position: absolute; top: 8px; right: 10px; }
  .income-dots-btn { background: none; border: none; color: var(--text-hint); cursor: pointer; font-size: 18px; padding: 2px 4px; border-radius: 4px; line-height: 1; }
  .income-dots-btn:hover { background: var(--bg); color: var(--text); }

  .income-expand { display: none; border-top: 0.5px solid var(--border); padding: 16px; background: var(--bg); border-radius: 0 0 var(--radius) var(--radius); }
  .income-expand.open { display: block; }
  .income-expand-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem; }
  .income-field { display: flex; flex-direction: column; gap: 5px; }
  .income-field-label { font-size: 11px; font-weight: 600; color: var(--text-hint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .income-field select, .income-field input[type=date] { font-size: 13px; border: 0.5px solid var(--border-strong); border-radius: 6px; padding: 5px 8px; background: var(--surface); color: var(--text); width: 100%; }
  .income-pattern-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
  .income-hdr { font-size: 11px; font-weight: 600; color: var(--text-hint); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px; padding: 0 4px 0 16px; display: grid; grid-template-columns: 1fr 1fr auto; gap: 1rem; align-items: center; }

  header {
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    padding: 1.25rem 1.5rem;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  header h1 {
    font-family: 'Abril Fatface', Georgia, serif;
    font-size: 32px;
    font-weight: 400;
    letter-spacing: 0.01em;
    line-height: 1;
    margin: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4em;
    align-items: baseline;
  }
  header h1 .word-payday     { color: #B1AC37; }
  header h1 .word-budget     { color: #454C7B; }
  header h1 .word-calculator { color: #E26728; }

  header p {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  main { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

  .month-section { margin-bottom: 2.5rem; }

  .month-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.75rem;
    padding-left: 2px;
  }

  .period-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
  }

  .period-summary {
    display: grid;
    grid-template-columns: 5fr 100px 80px 80px auto 18px;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.25rem 2rem 1.25rem;
    cursor: pointer;
    user-select: none;
    position: relative;
  }

  .period-summary:hover { background: #fdfdfa; }

  .period-date {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }

  .period-date .sub {
    font-size: 12px;
    color: var(--text-hint);
    font-weight: 400;
    margin-top: 3px;
  }

  .income-col {
    text-align: right;
  }

  .income-col .label, .bills-col .label {
    font-size: 11px;
    color: var(--text-hint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    margin-bottom: 3px;
    min-height: 32px;
    line-height: 1.3;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
  }

  .income-col .amount, .bills-col .amount {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .bills-col {
    text-align: right;
  }

  /* === Unified badge system (5 states) — same look on manual + automatic cards === */
  .badge {
    min-width: 140px;
    max-width: 140px;
    text-align: center;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 0;
    border: 1px solid transparent;
    line-height: 1.2;
    box-sizing: border-box;
  }
  .badge.green {
    background: #B1AC37;
    color: #2a1a05;
    border-color: #B1AC37;
    font-size: 15px;
    font-weight: 700;
  }
  .badge.hold {
    background: #FEBF47;
    color: #2a1a05;
    border-color: #FEBF47;
  }
  .badge.grey {
    background: transparent;
    color: #454C7B;
    border-color: #454C7B;
  }
  .badge.amber {
    background: #E26728;
    color: #2a1a05;
    border-color: #E26728;
    white-space: nowrap;
  }
  .badge.red {
    background: #B42457;
    color: #ffffff;
    border-color: #B42457;
    font-size: 11px;
    font-weight: 700;
  }
  .badge.red .shortfall-amt {
    font-size: 15px;
    margin-top: 4px;
    display: block;
  }

  .chevron {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--text-hint);
    cursor: pointer;
    white-space: nowrap;
  }

  .chevron-icon {
    font-size: 18px;
    line-height: 1;
    transition: transform 0.2s;
  }

  .period-card.open .chevron-icon { transform: rotate(180deg); }

  .period-detail {
    display: none;
    border-top: 0.5px solid var(--border);
    padding: 0;
  }

  .period-card.open .period-detail { display: block; }

  .detail-section {
    border-top: 0.5px solid var(--border);
  }

  
  

  .detail-header {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 0.5rem;
    padding: 10px 1.25rem;
    background: transparent;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-hint);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    border-bottom: 0.5px solid var(--border);
  }

  .detail-section.income .detail-header { color: #1f7a3e; }
  .detail-section.expense .detail-header { color: #b53030; }

  .detail-section-icon {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
  }

  .detail-section.income .detail-section-icon {
    background: rgba(34, 197, 94, 0.15);
    color: #1f7a3e;
  }

  .detail-section.expense .detail-section-icon {
    background: rgba(220, 38, 38, 0.12);
    color: #b53030;
  }

  .bill-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 0.75rem;
    padding: 9px 1.25rem;
    border-top: 0.5px solid var(--border);
    font-size: 13px;
    background: transparent;
  }

  .bill-row:first-of-type { border-top: none; }

  .bill-day {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    background: rgba(0,0,0,0.04);
    border-radius: 4px;
    padding: 2px 7px;
    min-width: 36px;
    text-align: center;
  }

  .bill-name { color: var(--text); }

  .bill-amount {
    font-weight: 500;
    color: var(--text);
    text-align: right;
  }

  .bill-total-row {
    display: grid;
    grid-template-columns: 1fr auto;
    padding: 10px 1.25rem;
    border-top: 1px solid var(--border-strong);
    font-size: 13px;
    font-weight: 700;
  }

  .bill-total-row .total-label {
    color: var(--text-muted);
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.06em;
  }

  .bill-total-row .total-amount { color: var(--text); }
  .detail-section.income .bill-total-row .total-amount { color: #1f7a3e; }
  .detail-section.expense .bill-total-row .total-amount { color: #b53030; }

  .income-breakdown {
    display: flex;
    gap: 1.5rem;
    padding: 10px 1.25rem;
    border-top: 0.5px solid var(--border);
    background: var(--green-bg);
  }

  .income-item { font-size: 12px; color: var(--green); }
  .income-item strong { font-weight: 600; }

  .period-cover-note {
    font-size: 12px;
    color: #2a1a05;
    padding: 10px 1.25rem;
    background: #fde8d4;
    border-top: 0.5px solid #E26728;
    border-left: 3px solid #E26728;
  }

  .period-cover-note.grey {
    color: #454C7B;
    background: #f0f1f6;
    border-top: 0.5px solid #454C7B;
    border-left: 3px solid #454C7B;
  }

  .period-cover-note.red {
    color: #B42457;
    background: #fae0e9;
    border-top: 0.5px solid #B42457;
    border-left: 3px solid #B42457;
  }

  .period-cover-note.hold {
    color: #5c4400;
    background: #fdedc7;
    border-top: 0.5px solid #FEBF47;
    border-left: 3px solid #FEBF47;
  }

  footer {
    text-align: center;
    padding: 2rem 1rem;
    font-size: 12px;
    color: var(--text-hint);
  }

  .balance-bar {
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    padding: 0.75rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  .balance-bar label {
    font-size: 13px;
    color: var(--blue);
    font-weight: 500;
    white-space: nowrap;
  }

  .balance-bar input[type="date"] {
    font-size: 13px;
    padding: 5px 10px;
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    height: 32px;
    width: 150px;
  }

  .balance-bar input[type="date"]   { width: 150px; }

  .balance-bar button {
    font-size: 11px;
    padding: 5px 14px;
    height: 32px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--blue);
    background: var(--blue);
    color: #fff;
    cursor: pointer;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .balance-bar button:hover { opacity: 0.88; }

  .balance-bar .save-btn {
    background: #454C7B;
    border-color: #454C7B;
    color: #fff;
  }

  .balance-bar .save-btn:hover {
    opacity: 0.88;
  }

  .balance-bar .save-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .balance-bar .hint {
    font-size: 11px;
    color: var(--blue);
    opacity: 0.7;
  }

  @media (max-width: 600px) {
    .period-summary {
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
    }
    .income-col { display: none; }
    .bills-col  { display: none; }
  }
  .baseline-box {
    margin-top: 10px;
    margin-bottom: 10px;
  }

  .baseline-card {
    background: #fdfcfa;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .bl-menu-wrap { position: relative; }
  .bl-dots { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--text-muted); padding: 2px 2px; border-radius: 4px; line-height: 1; min-width: 18px; }
  .bl-dots:hover { background: var(--bg); color: var(--text); }

  .baseline-header {
    padding: 8px 1.25rem;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    display: flex;
    align-items: center;
    gap: 6px;
    background: #e8ff4a;
    color: #3a4d00;
  }

  .baseline-card.shortfall .baseline-header {
    background: var(--red-bg);
    color: var(--red);
  }

  .baseline-row {
    display: grid;
    grid-template-columns: 5fr 100px 80px 80px auto 18px;
    align-items: center;
    gap: 1rem;
    padding: 1.75rem 1.25rem 2rem 1.25rem;
    position: relative;
  }
  .baseline-row > .bl-menu-wrap {
    margin-left: -0.75rem;
    margin-right: -0.5rem;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1><span class="word-payday">PAYDAY</span><span class="word-budget">BUDGET</span><span class="word-calculator">CALCULATOR</span></h1>
  </div>

</header>

<div class="balance-bar">
  <input type="date" id="balanceDate">
  <div style="display:flex;align-items:center;background:var(--surface);border:0.5px solid var(--border-strong);height:32px;padding:0 8px;gap:2px;">
    <span style="font-size:13px;color:var(--text-muted);user-select:none;">$</span>
    <input type="text" inputmode="decimal" id="balanceAmount" placeholder="0" oninput="liveFormatAmount(this)" onblur="formatAmountInput(this)"
      style="width:120px;font-size:13px;border:none;background:transparent;color:var(--text);padding:0;outline:none;text-align:right;">
  </div>
  <button class="save-btn" id="saveBtn" onclick="saveBalance()">Save Balance</button>
  <div class="tab-bar-buffer" style="margin-left:auto;">
    <span class="lbl">Buffer</span>
    <span class="dollar">$</span>
    <input id="bufferInput" type="text" inputmode="numeric" value="0"
      oninput="onBufferInput(this)" onblur="formatBufferInput(this)" onfocus="stripAmountInput(this)">
  </div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('budget')">Budget</button>
  <button class="tab-btn" onclick="switchTab('bills')">Expenses</button>
  <button class="tab-btn" onclick="switchTab('income')">Income</button>
</div>

<div class="tab-panel active" id="tab-budget">
  <main>
    <div id="periodsContainer"></div>
  </main>
</div>

<div class="tab-panel" id="tab-bills">
  <div class="bills-panel-wrap">
    <div class="income-hdr" style="grid-template-columns:1fr auto auto;">
      <span>Expense Source</span>
      <span style="padding-right:1rem;">Amount</span>
      <span style="padding-right:42px;text-align:center;">Details</span>
    </div>
    <div id="billsBody"></div>
    <button class="add-bill-btn" onclick="addBillRow()">+ Add Expense</button>
  </div>
</div>

<div class="tab-panel" id="tab-income">
  <div class="bills-panel-wrap">
    <div class="income-hdr" style="grid-template-columns:1fr auto auto;">
      <span>Income Source</span>
      <span style="padding-right:1rem;">Amount(s)</span>
      <span style="padding-right:42px;text-align:center;">Details</span>
    </div>
    <div id="incomeBody"></div>
    <button class="add-bill-btn" onclick="addIncomeRow()">+ Add Income</button>
  </div>
</div>

<div id="savedToast" style="display:none;position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);font-size:12px;padding:8px 18px;border-radius:20px;z-index:9999;pointer-events:none;">Saved ✓</div>

<footer style="text-align:center;padding:1rem;font-size:11px;color:var(--text-hint);display:flex;align-items:center;justify-content:center;gap:1.5rem;">
  <span>v1.0.0</span>
  <button onclick="handleDownloadArchive()"
    style="font-size:11px;padding:4px 12px;border-radius:6px;border:0.5px solid var(--border-strong);background:var(--surface);color:var(--text-muted);cursor:pointer;">
    ↓ Download Archived Data
  </button>
</footer>

<script>
let BUFFER = 0;

let BILLS = [];

function daysBetween(a, b) {
  return Math.round((b - a) / 86400000);
}

function isExpired(item, dt) {
  if (!item.endDate) return false;
  const [ey, em, ed] = item.endDate.split("-").map(Number);
  return dt > new Date(ey, em-1, ed);
}

function hasStarted(item, dt) {
  if (!item.startDate) return true;
  const [sy, sm, sd] = item.startDate.split("-").map(Number);
  return dt >= new Date(sy, sm-1, sd);
}

function billsOnDate(dt) {
  const d = dt.getDate(), m = dt.getMonth() + 1;
  return BILLS.filter(b => {
    if (isExpired(b, dt)) return false;
    if (!hasStarted(b, dt)) return false;
    // Weekly: hits every 7 days from startDate
    if (b.freq === "weekly") {
      if (!b.startDate) return false;
      const [sy, sm, sd] = b.startDate.split("-").map(Number);
      const start = new Date(sy, sm-1, sd);
      const diff = Math.round((dt - start) / 86400000);
      return diff >= 0 && diff % 7 === 0;
    }
    // Biweekly: hits every 14 days from startDate
    if (b.freq === "biweekly") {
      if (!b.startDate) return false;
      const [sy, sm, sd] = b.startDate.split("-").map(Number);
      const start = new Date(sy, sm-1, sd);
      const diff = Math.round((dt - start) / 86400000);
      return diff >= 0 && diff % 14 === 0;
    }
    // One-time: only on the exact startDate
    if (b.freq === "one_time") {
      if (!b.startDate) return false;
      const [sy, sm, sd] = b.startDate.split("-").map(Number);
      return dt.getFullYear() === sy && dt.getMonth() + 1 === sm && dt.getDate() === sd;
    }
    // Annually: same day/month each year
    if (b.freq === "annually") {
      if (!b.days.includes(d)) return false;
      if (!b.startDate) return false;
      const startMonth = parseInt(b.startDate.split("-")[1]);
      return m === startMonth;
    }
    if (b.freq === "bimonthly") return d === 1 || d === 15;
    if (!b.days.includes(d)) return false;
    if (b.freq === "monthly") return true;
    if (b.freq === "quarterly") {
      if (!b.startDate) return false;
      const [sy, sm, sd] = b.startDate.split("-").map(Number);
      if (dt.getDate() !== b.days[0]) return false;
      const monthsDiff = (dt.getFullYear() - sy) * 12 + (dt.getMonth() + 1 - sm);
      return monthsDiff >= 0 && monthsDiff % 3 === 0;
    }

    return false;
  });
}

// Build paydays through Jan 2027
function buildPaydays() {
  const now = new Date();
  const rangeStart = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const rangeEnd   = new Date(now.getFullYear(), now.getMonth() + 6, 1);

  const pdSet = new Set();

  // Only use income sources marked as period drivers
  const drivers = INCOME_SOURCES.filter(src => src.isPeriodDriver && src.startDate && !src.hidden);

  drivers.forEach(src => {
    const [sy, sm, sd] = src.startDate.split("-").map(Number);
    const anchor = new Date(sy, sm-1, sd);
    const step = src.freq === "weekly" ? 7 : src.freq === "biweekly" ? 14 :
                 src.freq === "monthly" ? null : src.freq === "semimonthly" ? null : 14;

    if (src.freq === "monthly") {
      // Monthly: same day each month
      let y = rangeStart.getFullYear(), m = rangeStart.getMonth();
      while (new Date(y, m, 1) < rangeEnd) {
        const d = Math.min(sd, new Date(y, m+1, 0).getDate());
        const dt = new Date(y, m, d);
        if (dt >= rangeStart) pdSet.add(dt.toDateString());
        m++; if (m > 11) { m = 0; y++; }
      }
    } else if (src.freq === "semimonthly") {
      // Semimonthly: 1st and 15th
      let y = rangeStart.getFullYear(), m = rangeStart.getMonth();
      while (new Date(y, m, 1) < rangeEnd) {
        [1, 15].forEach(d => {
          const dt = new Date(y, m, d);
          if (dt >= rangeStart) pdSet.add(dt.toDateString());
        });
        m++; if (m > 11) { m = 0; y++; }
      }
    } else if (step) {
      // Weekly / biweekly: step from anchor
      let cur = new Date(anchor);
      while (cur < rangeStart) cur = new Date(cur.getTime() + step * 86400000);
      while (cur >= rangeStart) cur = new Date(cur.getTime() - step * 86400000);
      cur = new Date(cur.getTime() + step * 86400000);
      while (cur < rangeEnd) {
        pdSet.add(cur.toDateString());
        cur = new Date(cur.getTime() + step * 86400000);
      }
    }
  });

  // Fallback if no drivers defined
  if (pdSet.size === 0) {
    let cur = new Date(now.getFullYear(), now.getMonth(), 1);
    const end = new Date(now.getFullYear(), now.getMonth() + 6, 1);
    while (cur < end) {
      pdSet.add(cur.toDateString());
      cur = new Date(cur.getTime() + 14 * 86400000);
    }
  }

  return [...pdSet].map(s => new Date(s)).sort((a, b) => a - b);
}

function fmt(n) {
  return Math.round(n).toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
}

function ordinal(d) {
  if (d === 1 || d === 21 || d === 31) return d + "st";
  if (d === 2 || d === 22) return d + "nd";
  if (d === 3 || d === 23) return d + "rd";
  return d + "th";
}

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const FULL_MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

// No default override — user sets their own starting balance
const today = new Date();

// Balance override state — starts as the default

// Saved balances — array of { date: Date, amount: number }, sorted by date
let savedBalances = [];

// Frozen period snapshots — once a period ends, its values are locked
// Keyed by payday ISO date string
let FROZEN_PERIODS = {};

function onBufferInput(input) {
  const raw = input.value.replace(/,/g, "");
  const val = parseFloat(raw);

  // Reformat with commas while preserving cursor position
  const cursorPos = input.selectionStart;
  const oldLen = input.value.length;
  const commasBefore = (input.value.slice(0, cursorPos).match(/,/g) || []).length;

  const parts = raw.split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const formatted = parts.join(".");
  input.value = formatted;

  // Adjust cursor for added/removed commas
  const newCommasBefore = (formatted.slice(0, cursorPos).match(/,/g) || []).length;
  const newCursor = cursorPos + (newCommasBefore - commasBefore);
  input.setSelectionRange(newCursor, newCursor);

  if (!isNaN(val) && val >= 0) {
    BUFFER = val;
    saveToStorage();
    refresh();
    if (savedBalances.length > 0) updateBaselineBox();
  }
}

function formatBufferInput(input) {
  const val = parseFloat(input.value.replace(/,/g, ""));
  if (!isNaN(val)) {
    input.value = val.toLocaleString("en-US");
    BUFFER = val;
    refresh();
    if (savedBalances.length > 0) updateBaselineBox();
  }
}

function parseAmount(id) {
  return parseFloat(document.getElementById(id).value.replace(/,/g, "")) || 0;
}

function liveFormatAmount(el) {
  // Strip everything except digits and one decimal point
  let raw = el.value.replace(/[^0-9.]/g, "");
  // Keep only first decimal point
  const parts = raw.split(".");
  if (parts.length > 2) raw = parts[0] + "." + parts.slice(1).join("");
  // Format integer part with commas, preserve decimal as typed
  const dotIdx = raw.indexOf(".");
  const intPart = dotIdx >= 0 ? raw.slice(0, dotIdx) : raw;
  const decPart = dotIdx >= 0 ? raw.slice(dotIdx) : "";
  const formatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  el.value = formatted + decPart;
}

function formatAmountInput(el) {
  const val = parseFloat(el.value.replace(/,/g, ""));
  if (!isNaN(val) && val > 0) {
    el.value = Math.round(val).toLocaleString("en-US");
  }
}

function stripAmountInput(el) {
  el.value = el.value.replace(/,/g, "");
}

function saveBalance() {
  const dateVal = document.getElementById("balanceDate").value;
  const amtVal  = parseAmount("balanceAmount");
  if (!dateVal || isNaN(amtVal)) return;
  const [y, m, d] = dateVal.split("-").map(Number);
  const newEntry = { date: new Date(y, m-1, d), amount: amtVal };

  // Remove any existing entry for the same date, then add new one
  savedBalances = savedBalances.filter(b => b.date.toDateString() !== newEntry.date.toDateString());
  savedBalances.push(newEntry);
  savedBalances.sort((a, b) => a.date - b.date);

  // Reset input
  const amtInput = document.getElementById("balanceAmount");
  if (amtInput) amtInput.value = "";

  saveToStorage();
  refresh();
}

function deleteBaseline(dateStr) {
  if (dateStr) {
    savedBalances = savedBalances.filter(b => b.date.toDateString() !== new Date(dateStr).toDateString());
  } else {
    savedBalances = [];
  }
  saveToStorage();
  refresh();
}

function editBaselineAmount(dateIso, spanId) {
  const span = document.getElementById(spanId);
  if (!span) return;
  const current = parseFloat(span.dataset.amount || "0");
  const oldHtml = span.innerHTML;
  span.innerHTML = `<input type="text" inputmode="decimal" value="${current.toLocaleString("en-US")}" style="width:90px;font-size:13px;font-weight:500;text-align:right;border:0.5px solid var(--border-strong);background:var(--surface);color:var(--chartreuse-dark);padding:2px 4px;outline:none;" />`;
  const input = span.querySelector("input");
  input.focus();
  input.select();
  input.addEventListener("click", (e) => e.stopPropagation());
  const commit = () => {
    const newVal = parseFloat(input.value.replace(/,/g, ""));
    if (!isNaN(newVal) && newVal >= 0) {
      const targetDate = new Date(dateIso);
      const entry = savedBalances.find(b => b.date.toDateString() === targetDate.toDateString());
      if (entry) {
        entry.amount = newVal;
        saveToStorage();
        refresh();
        return;
      }
    }
    span.innerHTML = oldHtml;
  };
  input.addEventListener("blur", commit);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter")       { e.preventDefault(); input.blur(); }
    else if (e.key === "Escape") { e.preventDefault(); span.innerHTML = oldHtml; }
  });
}

function renderBaselineContent(overrideData, period, idSuffix) {
  idSuffix = idSuffix || "";
  const card   = document.getElementById(idSuffix ? "baselineCard-"+idSuffix : "baselineCard");
  const header = document.getElementById(idSuffix ? "baselineHeader-"+idSuffix : "baselineHeader");
  const row    = document.getElementById(idSuffix ? "baselineRow-"+idSuffix : "baselineRow");
  if (!card || !header || !row) return;

  const dateStr = overrideData.date.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });

  // Collect bills AND income from the day AFTER the saved date forward to next payday
  let billsRemaining = 0;
  let incomeRemaining = 0;
  const remainingBillsList = [];
  const remainingIncomeList = [];
  if (period) {
    let cur = new Date(overrideData.date.getTime() + 86400000); // day after
    while (cur.getTime() < period.nextPayday.getTime()) {
      billsOnDate(cur).forEach(b => {
        billsRemaining += b.amt;
        remainingBillsList.push({ name: b.name, amt: b.amt, day: cur.getDate() });
      });
      incomeDetailsOnDate(cur).forEach(i => {
        incomeRemaining += i.amt;
        remainingIncomeList.push({ name: i.name, amt: i.amt, day: cur.getDate() });
      });
      cur = new Date(cur.getTime() + 86400000);
    }
  }

  // Use the period's forward-looking lump sum if available, otherwise fall back to simple calc
  // Use manual values for subsequent balance periods (saved-amount-based)
  // Use cascade-based values for first balance period (already saved-amount-based)
  const fwdNet      = period && period.manualFwdNet !== undefined ? period.manualFwdNet
                    : period && period.fwdNet !== undefined ? period.fwdNet
                    : (overrideData.amount - billsRemaining - BUFFER);
  const maxAvailC   = period && period.manualMaxAvail !== undefined ? period.manualMaxAvail
                    : period ? (overrideData.amount + period.totalIn - period.totalBills - BUFFER)
                    : (overrideData.amount - billsRemaining - BUFFER);
  const effNetCard  = Math.min(fwdNet, maxAvailC);
  const lumpSum     = period && period.manualLumpSum !== undefined ? Math.round(period.manualLumpSum)
                    : period && period.lumpSum !== undefined ? Math.round(period.lumpSum)
                    : Math.max(0, overrideData.amount - billsRemaining - BUFFER);
  const isShortfall = effNetCard < -50;
  const isStaleSrc  = effNetCard < -50 && Math.abs(effNetCard) > BUFFER;
  const isGreyCard  = Math.abs(maxAvailC) <= 50 && effNetCard >= -50;
  const isAmberCard = !isGreyCard && effNetCard < -50 && Math.abs(effNetCard) <= BUFFER;
  const isHoldCard  = !isGreyCard && !isAmberCard && !isStaleSrc && maxAvailC > 50 && effNetCard <= 50;

  card.className = "baseline-card" + (isShortfall ? " shortfall" : "");

  // Colored left stripe — matches the badge color exactly
  const stripeColor = isStaleSrc    ? "#B42457"   // red — "Additional Funds Needed"
                    : isAmberCard   ? "#E26728"   // amber — "Buffer Being Used"
                    : isHoldCard    ? "#FEBF47"   // hold — "Hold for Future"
                    : isGreyCard    ? "#454C7B"   // navy — "Break Even"
                                    : "#B1AC37";  // olive — green/lump sum
  card.style.borderLeft = `5px solid ${stripeColor}`;

  const amountSpanId = "blAmt_" + (idSuffix || "first");
  const actionBtn = `<div class="bl-menu-wrap">
        <button class="bl-dots" onclick="event.stopPropagation();deleteBaseline('${overrideData.date.toISOString()}');" aria-label="Delete">&#10005;</button>
      </div>`;

  header.style.display = "none";

  const toggleDetail = () => {
    const detail = document.getElementById("baselineDetail");
    if (detail) {
      const open = detail.style.display !== "none";
      detail.style.display = open ? "none" : "block";
      const chev = document.getElementById("baselineChevron");
      if (chev) chev.style.transform = open ? "" : "rotate(180deg)";
    }
  };

  row.style.cursor = "pointer";
  row.onclick = toggleDetail;

  row.innerHTML = `
    <div class="period-date">
      Balance on<br>${dateStr}
      <div class="sub">${MONTHS[overrideData.date.getMonth()]} ${overrideData.date.getDate()} – ${period ? MONTHS[(new Date(period.nextPayday.getTime() - 86400000)).getMonth()] + ' ' + (new Date(period.nextPayday.getTime() - 86400000)).getDate() : ''}</div>
    </div>
    <div class="bills-col">
      <div class="label">Updated<br>Balance</div>
      <div class="amount" style="color:var(--chartreuse-dark);cursor:pointer;" id="${amountSpanId}" data-amount="${overrideData.amount}" title="Double-click to edit" ondblclick="event.stopPropagation();editBaselineAmount('${overrideData.date.toISOString()}','${amountSpanId}')" onclick="event.stopPropagation();">${fmt(overrideData.amount)}</div>
    </div>
    <div class="income-col">
      <div class="label">Income</div>
      <div class="amount">${incomeRemaining > 0 ? fmt(incomeRemaining) : '—'}</div>
    </div>
    <div class="bills-col">
      <div class="label">Remaining<br>Expenses</div>
      <div class="amount">${fmt(billsRemaining)}</div>
    </div>
    ${isStaleSrc
      ? `<div class="badge red">ADDITIONAL FUNDS NEEDED<span class="shortfall-amt">${fmt(Math.abs(effNetCard) - BUFFER)}</span></div>`
      : isAmberCard
        ? `<div class="badge amber">Buffer Being Used</div>`
      : isHoldCard
        ? `<div class="badge hold">Hold for Future</div>`
      : isGreyCard
        ? `<div class="badge grey">Break Even</div>`
      : `<div class="badge green">${fmt(lumpSum)}</div>`
    }
    ${actionBtn || '<div></div>'}
    <span class="chevron" style="position:absolute;bottom:10px;right:1.25rem;font-size:10px;">
      Details <span class="chevron-icon" id="baselineChevron" style="font-size:13px;">⌄</span>
    </span>
  `;

  // Build expandable detail
  const billRows = remainingBillsList.map(b => `
    <div class="bill-row">
      <span class="bill-day">${ordinal(b.day)}</span>
      <span class="bill-name">${b.name}</span>
      <span class="bill-amount">${fmt(b.amt)}</span>
    </div>`).join("");

  const incomeRows = remainingIncomeList.map(i => `
    <div class="bill-row">
      <span class="bill-day">${ordinal(i.day)}</span>
      <span class="bill-name">${i.name}</span>
      <span class="bill-amount">${fmt(i.amt)}</span>
    </div>`).join("");

  // Remove old detail if exists, then append fresh
  const oldDetail = document.getElementById("baselineDetail");
  if (oldDetail) oldDetail.remove();

  const detail = document.createElement("div");
  detail.id = "baselineDetail";
  detail.style.display = "none";
  detail.style.borderTop = "0.5px solid var(--border)";
  const headerStyle = 'display:grid;grid-template-columns:1fr auto;padding:8px 1.25rem;background:var(--bg);font-size:11px;font-weight:600;color:var(--text-hint);text-transform:uppercase;letter-spacing:0.06em;';
  detail.innerHTML = `
    ${incomeRows ? `
      <div class="detail-section income">
        <div class="detail-header">
          <span class="detail-section-icon">+</span>
          <span>Income remaining this period</span>
          <span>Amount</span>
        </div>
        ${incomeRows}
        <div class="bill-total-row">
          <span class="total-label">Total income</span>
          <span class="total-amount">${fmt(incomeRemaining)}</span>
        </div>
      </div>
    ` : ""}
    ${billRows ? `
      <div class="detail-section expense">
        <div class="detail-header">
          <span class="detail-section-icon">−</span>
          <span>Expenses remaining this period</span>
          <span>Amount</span>
        </div>
        ${billRows}
        <div class="bill-total-row">
          <span class="total-label">Total expenses</span>
          <span class="total-amount">${fmt(billsRemaining)}</span>
        </div>
      </div>
    ` : ""}`;

  card.appendChild(detail);

}

function updateBaselineBox() {
  refresh(); // renderPeriods will inject and populate the box
}

function computePeriods() {
  const paydays = buildPaydays();
  if (paydays.length < 2) return [];

  const sortedSaved = [...savedBalances].sort((a, b) => a.date - b.date);
  const hasAnySaved = sortedSaved.length > 0;

  // Helper: sum income and bills for a date range [start, end)
  function sumRange(start, end) {
    let totalIn = 0, totalBills = 0;
    const bills = [];
    const incomes = [];
    let cur = new Date(start);
    while (cur < end) {
      const incDetails = incomeDetailsOnDate(cur);
      const dayBills = billsOnDate(cur);
      incDetails.forEach(i => {
        totalIn += i.amt;
        incomes.push({ name: i.name, amt: i.amt, dueDay: cur.getDate() });
      });
      totalBills += dayBills.reduce((s, b) => s + b.amt, 0);
      dayBills.forEach(b => bills.push({ ...b, dueDay: cur.getDate() }));
      cur = new Date(cur.getTime() + 86400000);
    }
    return {
      totalIn,
      totalBills,
      bills: bills.sort((a, b) => a.dueDay - b.dueDay),
      incomes: incomes.sort((a, b) => a.dueDay - b.dueDay)
    };
  }

  // Build the period boundaries (limit by year+1 like before)
  const periods = [];
  for (let i = 0; i < paydays.length - 1; i++) {
    const pd = paydays[i];
    const nextPd = paydays[i + 1];
    if (pd.getFullYear() > new Date().getFullYear() + 1) break;
    periods.push({ pd, nextPd });
  }

  const results = [];
  let runningBalance = BUFFER;
  let firstBalanceDone = false;
  let staleAfter = false;

  const nowTime = new Date().getTime();

  for (let i = 0; i < periods.length; i++) {
    const { pd, nextPd } = periods[i];
    const periodKey = pd.toISOString();
    const periodHasEnded = nextPd.getTime() <= nowTime;

    // If period has ended AND we have a frozen snapshot, use it
    if (periodHasEnded && FROZEN_PERIODS[periodKey]) {
      const frozen = FROZEN_PERIODS[periodKey];
      // Reconstruct with proper Date objects and re-link runningBalance cascade
      const frozenResult = {
        ...frozen,
        payday: pd,
        nextPayday: nextPd,
        countFrom: frozen.countFrom ? new Date(frozen.countFrom) : pd,
        savedEntries: (frozen.savedEntries || []).map(e => ({ date: new Date(e.date), amount: e.amount })),
      };
      results.push(frozenResult);
      runningBalance = frozen.endBalance !== undefined ? frozen.endBalance : runningBalance;
      if (frozen.staleAfterValue !== undefined) staleAfter = frozen.staleAfterValue;
      if (frozen.firstBalanceDoneValue) firstBalanceDone = true;
      continue;
    }

    // Find saved balances that fall within this period
    const savedInPeriod = sortedSaved.filter(b =>
      b.date.getTime() >= pd.getTime() && b.date.getTime() < nextPd.getTime()
    );
    const isBalancePeriod = savedInPeriod.length > 0;
    const hasPriorSaved = sortedSaved.some(b => b.date.getTime() < pd.getTime());
    const isUpdatedPeriod = !isBalancePeriod && hasPriorSaved;

    // First balance: reset runningBalance AT START (no prior balance to cascade from)
    // Subsequent balances: don't modify THIS period — only reset runningBalance for NEXT period
    const isFirstBalanceHere = isBalancePeriod && !firstBalanceDone;
    if (isFirstBalanceHere) {
      const entry = savedInPeriod[savedInPeriod.length - 1];
      runningBalance = entry.amount;
      staleAfter = false;
    }

    // Determine period start for calculations
    // - First balance: start from saved date (since prior history is unknown)
    // - Subsequent balance OR no balance: use full period
    const periodStart = isFirstBalanceHere
      ? savedInPeriod[savedInPeriod.length - 1].date
      : pd;
    const countFromDate = isFirstBalanceHere
      ? new Date(periodStart.getTime() + 86400000) // day after saved date
      : periodStart;
    const { totalIn, totalBills, bills: periodBills, incomes: periodIncomes } = sumRange(countFromDate, nextPd);

    const bal = runningBalance;

    // HARD BUFFER: track running balance through this period + next ~6 periods
    // Find the minimum projected balance point — buffer must always be maintained there
    let cumNet = totalIn - totalBills;
    let minCumNet = cumNet;
    // Project forward through future periods (assuming no lump sums taken in those)
    // 6 months ≈ 6 monthly periods or 13 biweekly periods — use periods.length cap
    const lookaheadPeriods = 13;
    for (let fw = 1; fw <= lookaheadPeriods && i + fw < periods.length; fw++) {
      const fp = periods[i + fw];
      // Sum income/bills for the future raw period
      const fpData = sumRange(fp.pd, fp.nextPd);
      cumNet += fpData.totalIn - fpData.totalBills;
      minCumNet = Math.min(minCumNet, cumNet);
    }

    // Max safe lump sum: even at the worst projected point, balance must stay >= BUFFER
    // bal - L + minCumNet >= BUFFER  →  L <= bal + minCumNet - BUFFER
    const maxSafeLump = bal + minCumNet - BUFFER;

    // fwdNet drives badge logic — using max safe lump as the indicator
    const fwdNet = maxSafeLump;
    const maxAvailable = bal + totalIn - totalBills - BUFFER;

    // For SUBSEQUENT balance periods, the period card uses cascade-based math (above)
    // but the manual card needs its OWN math using the saved amount as the starting point
    let manualFwdNet, manualLumpSum, manualMaxAvail, manualEndBalance;
    if (isBalancePeriod && !isFirstBalanceHere) {
      const entry = savedInPeriod[savedInPeriod.length - 1];
      // Recount income/bills from day AFTER the saved date for the manual card view
      const manualCountFrom = new Date(entry.date.getTime() + 86400000);
      const manualTotals = sumRange(manualCountFrom, nextPd);
      // Forward looking from manual basis
      let manualCum = manualTotals.totalIn - manualTotals.totalBills;
      let manualMinCum = manualCum;
      for (let fw = 1; fw <= lookaheadPeriods && i + fw < periods.length; fw++) {
        const fp = periods[i + fw];
        const fpData = sumRange(fp.pd, fp.nextPd);
        manualCum += fpData.totalIn - fpData.totalBills;
        manualMinCum = Math.min(manualMinCum, manualCum);
      }
      manualFwdNet = entry.amount + manualMinCum - BUFFER;
      manualMaxAvail = entry.amount + manualTotals.totalIn - manualTotals.totalBills - BUFFER;
      manualLumpSum = Math.max(0, Math.min(manualFwdNet, manualMaxAvail));
      // End balance going into next period (after the manual lump sum is withdrawn)
      manualEndBalance = Math.max(0, entry.amount + manualTotals.totalIn - manualTotals.totalBills - manualLumpSum);
    }

    let lumpSum;
    if (!hasAnySaved) {
      lumpSum = 0;
    } else if (staleAfter) {
      lumpSum = 0;
    } else {
      lumpSum = Math.max(0, Math.min(maxSafeLump, maxAvailable));
    }

    // Detect red period — use the worse of forward outlook and current period
    // (matches badge logic in renderPeriods)
    const effectiveNetForStale = Math.min(fwdNet, maxAvailable);
    const isStaleSource = !staleAfter && effectiveNetForStale < -50 && Math.abs(effectiveNetForStale) > BUFFER;
    if (isStaleSource) staleAfter = true;

    const endBalance = Math.max(0, bal + totalIn - totalBills - lumpSum);

    const isFirstBalance = isFirstBalanceHere;
    if (isBalancePeriod) firstBalanceDone = true;
    const isStale = staleAfter && !isStaleSource;

    // For SUBSEQUENT balance periods: reset runningBalance to saved amount for NEXT period
    // (current period's calculations remain unchanged — this is the user's "checkpoint")
    if (isBalancePeriod && !isFirstBalance) {
      // Manual card lump sum gets withdrawn, so next period starts with what's left
      runningBalance = manualEndBalance;
      // If the manual baseline card ITSELF shows "Additional Funds Needed" shortfall,
      // propagate staleness to subsequent periods instead of resetting.
      // Mirrors the isStaleSrc check in renderBaselineContent.
      const baselineEffNet = Math.min(manualFwdNet, manualMaxAvail);
      const baselineIsStaleSrc = baselineEffNet < -50 && Math.abs(baselineEffNet) > BUFFER;
      staleAfter = baselineIsStaleSrc;
    } else {
      runningBalance = endBalance;
    }

    const periodResult = {
      payday: pd,
      nextPayday: nextPd,
      countFrom: new Date(periodStart),
      start: bal,
      totalIn,
      totalBills,
      lumpSum,
      fwdNet,
      periodBills,
      periodIncomes,
      isBalancePeriod,
      isFirstBalance,
      isUpdatedPeriod,
      isStale,
      savedEntries: savedInPeriod,
      manualFwdNet,
      manualLumpSum,
      manualMaxAvail,
      bufferAtPeriod: BUFFER,
      days: daysBetween(pd, nextPd),
    };
    results.push(periodResult);

    // Freeze period if it has just ended (no snapshot exists yet)
    if (periodHasEnded && !FROZEN_PERIODS[periodKey]) {
      FROZEN_PERIODS[periodKey] = {
        ...periodResult,
        countFrom: periodResult.countFrom.toISOString(),
        savedEntries: periodResult.savedEntries.map(e => ({ date: e.date.toISOString(), amount: e.amount })),
        endBalance,
        manualEndBalance,
        staleAfterValue: staleAfter,
        firstBalanceDoneValue: firstBalanceDone,
      };
      // Remove non-serializable fields (these don't matter for past periods)
      delete FROZEN_PERIODS[periodKey].payday;
      delete FROZEN_PERIODS[periodKey].nextPayday;
    }
  }

  // Save snapshots if any new periods were frozen
  saveToStorage();

  return results;
}

function handleDownloadArchive() {
  if (!window._archivedPeriods || window._archivedPeriods.length === 0) {
    alert("No archived periods yet. Periods older than one month will appear here.");
    return;
  }
  downloadArchive(window._archivedPeriods);
}

function downloadArchive(archivedPeriods) {
  const rows = [["Payday","Period","Total In","Total Bills","Lump Sum","Don't Go Below","Saved Balance Date","Saved Balance Amount"]];
  archivedPeriods.forEach(r => {
    const endDate = new Date(r.nextPayday.getTime() - 86400000);
    const range = `${MONTHS[r.payday.getMonth()]} ${r.payday.getDate()} – ${MONTHS[endDate.getMonth()]} ${endDate.getDate()}`;
    const paydayStr = r.payday.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });

    // Check if a saved balance falls within this period
    let savedDate = "", savedAmount = "";
    if (r.savedEntries && r.savedEntries.length > 0) {
      const last = r.savedEntries[r.savedEntries.length - 1];
      savedDate = last.date.toLocaleDateString("en-US", { month: "short", day: "numeric" });
      savedAmount = Math.round(last.amount);
    }

    rows.push([
      paydayStr, range,
      Math.round(r.totalIn),
      Math.round(r.totalBills),
      Math.round(r.lumpSum),
      Math.ceil((r.totalBills + BUFFER) / 100) * 100,
      savedDate,
      savedAmount
    ]);
  });
  const csv = rows.map(r => r.join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "archived_periods.csv";
  a.click();
}

function renderPeriods(periods) {
  const container = document.getElementById("periodsContainer");
  container.innerHTML = "";
  let currentMonth = null;
  let monthDiv = null;

  // Layout:
  // - Top: current month + next 4 months
  // - Bottom: previous month (faded)
  // - Archived: anything older than previous month
  const now = new Date();
  const thisMonth  = new Date(now.getFullYear(), now.getMonth(), 1);
  const prevMonth  = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const fwdLimit   = new Date(now.getFullYear(), now.getMonth() + 5, 1); // current + 4 more = 5 months ahead

  const archived = periods.filter(r => r.payday < prevMonth);
  const previous = periods.filter(r => r.payday >= prevMonth && r.payday < thisMonth);
  const current  = periods.filter(r => r.payday >= thisMonth && r.payday < fwdLimit);

  // Store archived for download
  if (archived.length > 0) window._archivedPeriods = archived;

  // The date of the first saved balance — used to hide pre-balance periods
  const sortedSavedFirst = savedBalances.length > 0
    ? [...savedBalances].sort((a,b) => a.date - b.date)[0].date
    : null;

  // Render first saved balance as standalone chartreuse card at the very top
  const firstBalancePeriod = [...current, ...previous].find(r => r.isFirstBalance);
  if (firstBalancePeriod && firstBalancePeriod.savedEntries && firstBalancePeriod.savedEntries.length > 0) {
    const entry = firstBalancePeriod.savedEntries[firstBalancePeriod.savedEntries.length - 1];
    const bwrap = document.createElement("div");
    bwrap.className = "baseline-box";
    bwrap.style.marginBottom = "1.5rem";
    bwrap.innerHTML = `
      <div class="baseline-card" id="baselineCard-first">
        <div class="baseline-header" id="baselineHeader-first"></div>
        <div class="baseline-row" id="baselineRow-first"></div>
      </div>`;
    container.appendChild(bwrap);
    renderBaselineContent(entry, firstBalancePeriod, "first");
  }

  // Render current + next month first (top)
  current.forEach((r, idx) => {
    // Skip the first balance period — it's shown as the standalone card above
    if (r.isFirstBalance) return;

    // Skip any period that ends before or on the first saved balance date
    if (sortedSavedFirst && r.nextPayday.getTime() <= sortedSavedFirst.getTime()) return;

    const m = r.payday.getMonth();
    const y = r.payday.getFullYear();
    const monthKey = `${y}-${m}`;

    if (monthKey !== currentMonth) {
      currentMonth = monthKey;
      monthDiv = document.createElement("div");
      monthDiv.className = "month-section";
      monthDiv.innerHTML = `<div class="month-label">${FULL_MONTHS[m]} ${y}</div>`;
      container.appendChild(monthDiv);
    }

    const fwdNet    = r.fwdNet !== undefined ? r.fwdNet : (r.totalIn - r.totalBills - BUFFER);
    const maxAvail  = (r.start || 0) + r.totalIn - r.totalBills - BUFFER;
    const effectiveNet = Math.min(fwdNet, maxAvail);
    const lumpRound = Math.round(r.lumpSum);
    // GREY (Break Even): this period AND forward both ~balanced
    const isGrey    = Math.abs(maxAvail) <= 50 && effectiveNet >= -50;
    // RED/AMBER: forward indicates buffer violation
    const isRed     = !isGrey && effectiveNet < -50 && Math.abs(effectiveNet) > BUFFER;
    const isAmber   = !isGrey && effectiveNet < -50 && Math.abs(effectiveNet) <= BUFFER;
    // HOLD: this period has surplus, but forward-looking holds it back for future bills
    const isHold    = !isGrey && !isAmber && !isRed && maxAvail > 50 && effectiveNet <= 50;
    // GREEN: clear surplus available to withdraw
    const isGreen   = !isGrey && !isAmber && !isRed && !isHold;
    const shortfall = Math.abs(effectiveNet) - BUFFER;
    const endDate = new Date(r.nextPayday.getTime() - 86400000);

    const card = document.createElement("div");
    card.className = "period-card" + (r.isUpdatedPeriod ? " updated-period" : "");
    if (r.isStale) card.style.opacity = "0.4";

    const dateRange = `${MONTHS[r.payday.getMonth()]} ${r.payday.getDate()} – ${MONTHS[endDate.getMonth()]} ${endDate.getDate()}`;
    const payDayStr = `${MONTHS[r.payday.getMonth()]} ${r.payday.getDate()}, ${r.payday.getFullYear()}`;

    const billRows = r.periodBills.map(b => `
      <div class="bill-row">
        <span class="bill-day">${ordinal(b.dueDay)}</span>
        <span class="bill-name">${b.name}</span>
        <span class="bill-amount">${fmt(b.amt)}</span>
      </div>
    `).join("");

    const incomeRows = (r.periodIncomes || []).map(i => `
      <div class="bill-row">
        <span class="bill-day">${ordinal(i.dueDay)}</span>
        <span class="bill-name">${i.name}</span>
        <span class="bill-amount">${fmt(i.amt)}</span>
      </div>
    `).join("");

    const incomeParts = [];
    if (r.yourPay > 0) incomeParts.push(`<span class="income-item">Your paycheck <strong>${fmt(r.yourPay)}</strong></span>`);
    if (r.partner > 0) incomeParts.push(`<span class="income-item">Partner deposit <strong>${fmt(r.partner)}</strong></span>`);

    let badgeHtml;
    if (savedBalances.length === 0) {
      badgeHtml = '<div style="min-width:140px;text-align:center;padding:8px 14px;border-radius:6px;font-size:11px;font-weight:500;background:var(--bg);color:var(--text-hint);border:0.5px dashed var(--border-strong);line-height:1.4;">Save your balance<br>to see calculations</div>';
    } else if (r.isStale) {
      badgeHtml = '<div style="min-width:140px;text-align:center;padding:8px 14px;border-radius:6px;font-size:11px;font-weight:500;background:var(--bg);color:var(--text-hint);border:0.5px dashed var(--border-strong);line-height:1.4;">Save a new balance<br>to continue</div>';
    } else if (isGrey) {
      badgeHtml = '<div class="badge grey">Break Even</div>';
    } else if (isHold) {
      badgeHtml = '<div class="badge hold">Hold for Future</div>';
    } else if (isGreen) {
      badgeHtml = '<div class="badge green">' + fmt(Math.round(r.lumpSum)) + '</div>';
    } else if (isAmber) {
      badgeHtml = '<div class="badge amber">Buffer Being Used</div>';
    } else {
      badgeHtml = '<div class="badge red">ADDITIONAL FUNDS NEEDED<span class="shortfall-amt">' + fmt(shortfall) + '</span></div>';
    }

    card.innerHTML = `
      <div class="period-summary">
        <div class="period-date">
          ${payDayStr}
          <div class="sub">${dateRange}</div>
        </div>
        <div class="bills-col">
          <div class="label">Payday<br>Balance</div>
          <div class="amount">${fmt(Math.round((r.start || 0) + r.totalIn))}</div>
        </div>
        <div class="income-col">
          <div class="label">Income</div>
          <div class="amount">${fmt(r.totalIn)}</div>
        </div>
        <div class="bills-col">
          <div class="label">Expenses</div>
          <div class="amount">${fmt(r.totalBills)}</div>
        </div>
        ${badgeHtml}
        <span></span>
        <span class="chevron" style="position:absolute;bottom:10px;right:1.25rem;font-size:10px;">
          Details <span class="chevron-icon" style="font-size:13px;">⌄</span>
        </span>
      </div>
      <div class="period-detail">
        ${incomeRows ? `
          <div class="detail-section income">
            <div class="detail-header">
              <span class="detail-section-icon">+</span>
              <span>Income this period</span>
              <span>Amount</span>
            </div>
            ${incomeRows}
            <div class="bill-total-row">
              <span class="total-label">Total income</span>
              <span class="total-amount">${fmt(r.totalIn)}</span>
            </div>
          </div>
        ` : ""}
        ${billRows ? `
          <div class="detail-section expense">
            <div class="detail-header">
              <span class="detail-section-icon">−</span>
              <span>Expenses this period</span>
              <span>Amount</span>
            </div>
            ${billRows}
            <div class="bill-total-row">
              <span class="total-label">Total expenses</span>
              <span class="total-amount">${fmt(r.totalBills)}</span>
            </div>
          </div>
        ` : ""}
        <div class="bill-total-row" style="background:var(--bg);">
          <span class="total-label">Buffer</span>
          <span class="total-amount">${fmt(r.bufferAtPeriod !== undefined ? r.bufferAtPeriod : BUFFER)}</span>
        </div>
        ${isAmber ? `<div class="period-cover-note">No need to panic — your buffer is going to cover the gap this period. Just don't pull anything out.</div>` : ""}
        ${isGrey ? `<div class="period-cover-note grey">Great Job — Income covers expenses exactly. Nothing to withdraw this period, your account holds steady at your buffer.</div>` : ""}
        ${isHold ? `<div class="period-cover-note hold">Hold off this period — your surplus is being saved to cover an upcoming bill. Don't pull anything out.</div>` : ""}
        ${isRed ? `<div class="period-cover-note red">This is serious — expenses exceed income AND buffer. You'll need to find additional funds to cover the gap.</div>` : ""}
      </div>
    `;

    card.querySelector(".period-summary").addEventListener("click", () => {
      card.classList.toggle("open");
    });

    monthDiv.appendChild(card);

    // Inject saved balance boxes (skip first balance — already shown at top)
    if (r.savedEntries && r.savedEntries.length > 0 && !r.isFirstBalance) {
      r.savedEntries.forEach((entry, ei) => {
        const bwrap = document.createElement("div");
        bwrap.id = `baselineBox-${ei}-${r.payday.getTime()}`;
        bwrap.className = "baseline-box";
        bwrap.innerHTML = `
          <div class="baseline-card" id="baselineCard-${ei}-${r.payday.getTime()}">
            <div class="baseline-header" id="baselineHeader-${ei}-${r.payday.getTime()}"></div>
            <div class="baseline-row" id="baselineRow-${ei}-${r.payday.getTime()}"></div>
          </div>`;
        monthDiv.appendChild(bwrap);
        renderBaselineContent(entry, r, `${ei}-${r.payday.getTime()}`);
      });
    }
  });

  // Render previous month at the bottom
  if (previous.length > 0) {
    const divider = document.createElement("div");
    divider.style.cssText = "margin: 2rem 0 0.5rem; border-top: 0.5px solid var(--border); padding-top: 1.5rem;";
    container.appendChild(divider);

    let prevMonthDiv = null;
    let prevMonthKey = null;

    previous.forEach(r => {
      const m = r.payday.getMonth();
      const y = r.payday.getFullYear();
      const monthKey = `${y}-${m}`;

      if (monthKey !== prevMonthKey) {
        prevMonthKey = monthKey;
        prevMonthDiv = document.createElement("div");
        prevMonthDiv.className = "month-section";
        prevMonthDiv.innerHTML = `<div class="month-label" style="color:var(--text-hint);">${FULL_MONTHS[m]} ${y}</div>`;
        container.appendChild(prevMonthDiv);
      }

      const prevFwdNet  = r.fwdNet !== undefined ? r.fwdNet : (r.totalIn - r.totalBills - BUFFER);
      const prevMaxAvail = (r.start || 0) + r.totalIn - r.totalBills - BUFFER;
      const prevEffNet   = Math.min(prevFwdNet, prevMaxAvail);
      const prevIsStale  = r.isStale;
      const prevIsGrey   = !prevIsStale && Math.abs(prevMaxAvail) <= 50 && prevEffNet >= -50;
      const prevIsRed    = !prevIsStale && !prevIsGrey && prevEffNet < -50 && Math.abs(prevEffNet) > BUFFER;
      const prevIsAmber  = !prevIsStale && !prevIsGrey && prevEffNet < -50 && Math.abs(prevEffNet) <= BUFFER;
      const prevIsHold   = !prevIsStale && !prevIsGrey && !prevIsAmber && !prevIsRed && prevMaxAvail > 50 && prevEffNet <= 50;
      const endDate = new Date(r.nextPayday.getTime() - 86400000);
      const card = document.createElement("div");
      card.className = "period-card";
      card.style.opacity = prevIsStale ? "0.3" : "0.6";
      const dateRange = `${MONTHS[r.payday.getMonth()]} ${r.payday.getDate()} – ${MONTHS[endDate.getMonth()]} ${endDate.getDate()}`;
      const payDayStr = `${MONTHS[r.payday.getMonth()]} ${r.payday.getDate()}, ${r.payday.getFullYear()}`;
      const billRows = r.periodBills.map(b => `
        <div class="bill-row">
          <span class="bill-day">${ordinal(b.dueDay)}</span>
          <span class="bill-name">${b.name}</span>
          <span class="bill-amount">${fmt(b.amt)}</span>
        </div>`).join("");
      const incomeParts = [];
      if (r.yourPay > 0) incomeParts.push(`<span class="income-item">Your paycheck <strong>${fmt(r.yourPay)}</strong></span>`);
      if (r.partner > 0) incomeParts.push(`<span class="income-item">Partner deposit <strong>${fmt(r.partner)}</strong></span>`);

      card.innerHTML = `
        <div class="period-summary">
          <div class="period-date">${payDayStr}<div class="sub">${dateRange}</div></div>
          <div class="bills-col"><div class="label">Payday<br>Balance</div><div class="amount">${fmt(Math.round((r.start || 0) + r.totalIn))}</div></div>
          <div class="income-col"><div class="label">Income</div><div class="amount">${fmt(r.start || 0)}</div></div>
          <div class="bills-col"><div class="label">Expenses</div><div class="amount">${fmt(r.totalBills)}</div></div>
          ${prevIsStale
            ? `<div style="min-width:140px;text-align:center;padding:8px 14px;border-radius:6px;font-size:11px;font-weight:500;background:var(--bg);color:var(--text-hint);border:0.5px dashed var(--border-strong);line-height:1.4;">Save a new balance<br>to continue</div>`
            : prevIsGrey
              ? `<div class="badge grey">Break Even</div>`
              : prevIsHold
                ? `<div class="badge hold">Hold for Future</div>`
                : prevIsAmber
                  ? `<div class="badge amber">Buffer Being Used</div>`
                  : prevIsRed
                    ? `<div class="badge red">ADDITIONAL FUNDS NEEDED<span class="shortfall-amt">${fmt(Math.abs(prevEffNet) - BUFFER)}</span></div>`
                    : `<div class="badge green">${fmt(Math.round(r.lumpSum))}</div>`
          }
          <span class="chevron">
          <span style="font-size:11px;color:var(--text-hint);">Details</span>
          <span class="chevron-icon">⌄</span>
        </span>
        </div>
        <div class="period-detail">
          ${incomeParts.length > 0 ? `<div class="income-breakdown">${incomeParts.join('<span style="color:var(--green);opacity:0.4">·</span>')}<span class="income-item" style="margin-left:auto">Total in: <strong>${fmt(r.totalIn)}</strong></span></div>` : ""}
          <div class="detail-header" style="display:grid;grid-template-columns:1fr auto;padding:8px 1.25rem;background:var(--bg);font-size:11px;font-weight:600;color:var(--text-hint);text-transform:uppercase;letter-spacing:0.06em;"><span>Expenses this period</span><span>Amount</span></div>
          ${billRows}
          <div class="bill-total-row"><span class="total-label">Total expenses</span><span class="total-amount">${fmt(r.totalBills)}</span></div>
          <div class="bill-total-row" style="background:var(--bg);"><span class="total-label">Buffer</span><span class="total-amount">${fmt(r.bufferAtPeriod !== undefined ? r.bufferAtPeriod : BUFFER)}</span></div>
        </div>`;

      card.querySelector(".period-summary").addEventListener("click", () => card.classList.toggle("open"));
      prevMonthDiv.appendChild(card);
    });
  }
}

function switchTab(tab) {
  document.querySelectorAll(".tab-btn").forEach((b, i) => {
    const tabs = ["budget","bills","income"];
    b.classList.toggle("active", tabs[i] === tab);
  });
  document.querySelectorAll(".tab-panel").forEach(p => {
    p.classList.toggle("active", p.id === `tab-${tab}`);
  });
  if (tab === "bills") renderBillsTable();
  if (tab === "income") renderIncomeTable();
}

const FREQ_OPTIONS = [
  { value: "weekly",         label: "Weekly" },
  { value: "biweekly",       label: "Every other week" },
  { value: "monthly",        label: "Monthly" },
  { value: "bimonthly",      label: "Twice a month (1st & 15th)" },
  { value: "quarterly",      label: "Quarterly" },
  { value: "annually",       label: "Annually" },
  { value: "one_time",       label: "One-time" },
];

function renderBillsTable(keepOpen) {
  const container = document.getElementById("billsBody");
  const openPanels = new Set();
  document.querySelectorAll("[id^='bill-expand-']").forEach(el => {
    if (el.classList.contains("open")) openPanels.add(el.id);
  });
  container.innerHTML = "";
  const now = new Date();
  const sorted = BILLS.map((bill, idx) => ({ bill, idx }))
    .sort((a, b) => {
      const aExp = a.bill.endDate ? now > new Date(a.bill.endDate) : false;
      const bExp = b.bill.endDate ? now > new Date(b.bill.endDate) : false;
      if (aExp !== bExp) return aExp ? 1 : -1;
      return 0;
    });
  sorted.filter(({ bill }) => !bill.hidden).forEach(({ bill, idx }) => container.appendChild(buildBillRow(bill, idx)));
  const toOpen = keepOpen !== undefined ? new Set([`bill-expand-${keepOpen}`]) : openPanels;
  toOpen.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.add("open");
  });
}

function buildBillRow(bill, idx) {
  const freqOpts = FREQ_OPTIONS.map(o =>
    `<option value="${o.value}" ${bill.freq === o.value ? "selected" : ""}>${o.label}</option>`
  ).join("");

  const expandId = `bill-expand-${idx}`;
  const amtPill  = `<span class="amt-pill">${fmt(bill.amt)}</span>`;

  const now = new Date();
  const billExpired = bill.endDate ? now > new Date(bill.endDate) : false;

  const card = document.createElement("div");
  card.className = "income-card" + (billExpired ? " expired" : "");
  card.draggable = true;
  card.dataset.idx = idx;
  card.addEventListener("dragstart", e => {
    e.dataTransfer.setData("text/plain", idx);
    e.dataTransfer.effectAllowed = "move";
    setTimeout(() => card.classList.add("dragging"), 0);
  });
  card.addEventListener("dragend", () => card.classList.remove("dragging"));
  card.addEventListener("dragover", e => { e.preventDefault(); card.classList.add("drag-over"); });
  card.addEventListener("dragleave", () => card.classList.remove("drag-over"));
  card.addEventListener("drop", e => {
    e.preventDefault();
    card.classList.remove("drag-over");
    const fromIdx = parseInt(e.dataTransfer.getData("text/plain"));
    const toIdx = parseInt(card.dataset.idx);
    if (fromIdx !== toIdx) {
      const moved = BILLS.splice(fromIdx, 1)[0];
      BILLS.splice(toIdx, 0, moved);
      renderBillsTable();
      refresh();
    }
  });
  card.innerHTML = `
    <div class="income-dots-wrap">
      <button class="income-dots-btn" onclick="event.stopPropagation();deleteBill(${idx});" aria-label="Delete">&#10005;</button>
    </div>
    <div class="income-row-main" style="grid-template-columns:1fr auto auto;cursor:pointer;"

function updateBill(idx, field, value) {
  if (field === "name")           BILLS[idx].name = value;
  else if (field === "amt")       { BILLS[idx].amt = isNaN(value) ? BILLS[idx].amt : value; renderBillsTable(idx); }
  else if (field === "day")       { BILLS[idx].days = [value]; renderBillsTable(idx); }
  else if (field === "startDate") BILLS[idx].startDate = value;
  else if (field === "endDate")   { BILLS[idx].endDate = value; renderBillsTable(idx); }
  else if (field === "freq")      { BILLS[idx].freq = value; renderBillsTable(idx); }
  refresh();
}

function updateBillAmt(idx, value) {
  if (isNaN(value) || value < 0) return;
  BILLS[idx].amt = value;
  // Update the pill in the row banner in-place (no full re-render, keeps focus)
  const card = document.getElementById(`bill-expand-${idx}`)?.closest('.income-card');
  if (card) {
    const pillsEl = card.querySelector('.income-row-main > div:nth-child(2)');
    if (pillsEl) {
      pillsEl.innerHTML = `<span class="amt-pill">${fmt(value)}</span>`;
    }
  }
  refresh();
}

function updateBillName(idx, value) {
  BILLS[idx].name = value;
  refresh();
}

function deleteBill(idx) {
  BILLS.splice(idx, 1);
  renderBillsTable();
  refresh();
}

function addBillRow() {
  BILLS.push({ name: "New Expense", days: [1], amt: 0, freq: "monthly", startDate: "" });
  const newIdx = BILLS.length - 1;
  renderBillsTable(newIdx);
  const tryOpen = () => {
    const expandEl = document.getElementById(`bill-expand-${newIdx}`);

// ── Income data ──────────────────────────────────────────────────────────
const INCOME_FREQ_OPTIONS = [
  { value: "biweekly",    label: "Every other week" },
  { value: "weekly",      label: "Weekly" },
  { value: "monthly",     label: "Monthly (fixed day)" },
  { value: "semimonthly", label: "Twice a month (1st & 15th)" },
  { value: "one_time",    label: "One-time" },
];

// amounts = array of values that cycle in order each occurrence
let INCOME_SOURCES = [];

function incomeDetailsOnDate(dt) {
  const details = [];
  INCOME_SOURCES.forEach(src => {
    if (!src.startDate) return;
    const [sy,sm,sd] = src.startDate.split("-").map(Number);
    const start = new Date(sy, sm-1, sd);
    if (dt < start) return;
    if (isExpired(src, dt)) return;
    const amts = src.amounts && src.amounts.length ? src.amounts : [0];
    let occurrenceIndex = -1;

    if (src.freq === "biweekly") {
      const diff = Math.round((dt - start) / 86400000);
      if (diff >= 0 && diff % 14 === 0) occurrenceIndex = Math.floor(diff / 14);
    } else if (src.freq === "weekly") {
      const diff = Math.round((dt - start) / 86400000);
      if (diff >= 0 && diff % 7 === 0) occurrenceIndex = Math.floor(diff / 7);
    } else if (src.freq === "monthly") {
      const day = sd;
      if (dt.getDate() === day) {
        occurrenceIndex = (dt.getFullYear() - sy) * 12 + (dt.getMonth() + 1 - sm);
      }
    } else if (src.freq === "semimonthly") {
      if (dt.getDate() === 1 || dt.getDate() === 15) occurrenceIndex = 1;
    } else if (src.freq === "one_time") {
      if (dt.getFullYear()===sy && dt.getMonth()+1===sm && dt.getDate()===sd) occurrenceIndex = 0;
    }

    if (occurrenceIndex >= 0) {
      const seq = src.sequence && src.sequence.length ? src.sequence : amts.map((_,i) => i);
      const seqIdx = occurrenceIndex % seq.length;
      const amtIdx = seq[seqIdx];
      const amt = amts[amtIdx] || 0;
      if (amt > 0) details.push({ name: src.source, amt });
    }
  });
  return details;
}

function renderIncomeTable(keepOpen) {
  const container = document.getElementById("incomeBody");
  const openPanels = new Set();
  document.querySelectorAll("[id^='income-expand-']").forEach(el => {
    if (el.classList.contains("open")) openPanels.add(el.id);
  });
  container.innerHTML = "";
  const now = new Date();
  const sorted = INCOME_SOURCES.map((src, idx) => ({ src, idx }))
    .sort((a, b) => {
      const aExp = a.src.endDate ? now > new Date(a.src.endDate) : false;
      const bExp = b.src.endDate ? now > new Date(b.src.endDate) : false;
      if (aExp !== bExp) return aExp ? 1 : -1;
      return 0;
    });
  sorted.filter(({ src }) => !src.hidden).forEach(({ src, idx }) => container.appendChild(buildIncomeRow(src, idx)));
  const toOpen = keepOpen !== undefined ? new Set([`income-expand-${keepOpen}`]) : openPanels;
  toOpen.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.add("open");
  });
}

function buildIncomeRow(src, idx) {
  const amounts  = src.amounts  && src.amounts.length  ? src.amounts  : [0];

  const sequence = src.sequence && src.sequence.length ? src.sequence : [0];
  const freqOpts = INCOME_FREQ_OPTIONS.map(o =>
    `<option value="${o.value}" ${src.freq === o.value ? "selected" : ""}>${o.label}</option>`
  ).join("");

  const hasPattern = amounts.length > 1;
  const pills = amounts.map((a, ai) =>
    `<span class="amt-pill">${fmt(a)}</span>`

  const amtRows = amounts.map((amt, ai) => `

        value="${amtNames[ai]}" onchange="updateIncomeAmtName(${idx},${ai},this.value)"

        value="${amt.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}"
        oninput="liveFormatAmount(this);updateIncomeAmt(${idx},${ai},parseFloat(this.value.replace(/,/g,'')))"
        onchange="updateIncomeAmt(${idx},${ai},parseFloat(this.value.replace(/,/g,'')))"
        onfocus="if(parseFloat(this.value.replace(/,/g,''))===0)this.value='';this.style.borderColor='var(--blue)'" onblur="this.style.borderColor='var(--border)'">
      ${amounts.length > 1 ? `<button onclick="removeIncomeAmt(${idx},${ai})" style="background:none;border:none;color:var(--text-hint);cursor:pointer;font-size:13px;padding:0 4px;">✕</button>` : ""}
    </div>`).join("");

  // Flow steps
  const flowSteps = sequence.map((amtIdx, si) => {
    const seqOpts = amtNames.map((n, ni) =>
      `<option value="${ni}" ${ni === amtIdx ? "selected" : ""}>${n}</option>`
    ).join("");
    const isLast = si === sequence.length - 1;
    return `
      <div style="display:flex;flex-direction:column;align-items:flex-start;">
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="font-size:11px;color:var(--text-hint);min-width:44px;">Step ${si+1}</span>
          <select class="amt-pill select-like"
            onchange="updateIncomeSeq(${idx},${si},parseInt(this.value))">${seqOpts}</select>
          <button onclick="removeIncomeSeq(${idx},${si})" style="background:none;border:none;color:var(--text-hint);cursor:pointer;font-size:13px;padding:0 4px;">✕</button>
        </div>
        ${!isLast ? '<div style="margin-left:50px;padding:3px 0;"><span style="font-size:14px;color:var(--text-hint);">↓</span></div>' : ""}
      </div>`;
  }).join("");

  const now = new Date();
  const srcExpired = src.endDate ? now > new Date(src.endDate) : false;

  const card = document.createElement("div");
  card.className = "income-card" + (srcExpired ? " expired" : "");
  card.draggable = true;
  card.dataset.idx = idx;
  card.addEventListener("dragstart", e => {
    e.dataTransfer.setData("text/plain", idx);
    e.dataTransfer.effectAllowed = "move";
    setTimeout(() => card.classList.add("dragging"), 0);
  });
  card.addEventListener("dragend", () => card.classList.remove("dragging"));
  card.addEventListener("dragover", e => { e.preventDefault(); card.classList.add("drag-over"); });
  card.addEventListener("dragleave", () => card.classList.remove("drag-over"));
  card.addEventListener("drop", e => {
    e.preventDefault();
    card.classList.remove("drag-over");
    const fromIdx = parseInt(e.dataTransfer.getData("text/plain"));
    const toIdx = parseInt(card.dataset.idx);
    if (fromIdx !== toIdx) {
      const moved = INCOME_SOURCES.splice(fromIdx, 1)[0];
      INCOME_SOURCES.splice(toIdx, 0, moved);
      renderIncomeTable();
      refresh();
    }
  });
  card.innerHTML = `
    <div class="income-dots-wrap">
      <button class="income-dots-btn" onclick="event.stopPropagation();deleteIncome(${idx});" aria-label="Delete">&#10005;</button>
    </div>
    <div class="income-row-main" style="grid-template-columns:1fr auto auto;cursor:pointer;"
      onclick="if(!event.target.closest('.income-dots-wrap')&&event.target.tagName!=='BUTTON')document.getElementById('${expandId}').classList.toggle('open')">
      <div style="display:flex;align-items:center;gap:10px;">
        <input class="income-source-name" value="${src.source}" ${srcExpired && !src.editing ? 'readonly style="pointer-events:none;"' : `readonly ondblclick="this.removeAttribute('readonly');if(this.value==='New Income')this.value='';this.focus();event.stopPropagation();" onchange="updateIncome(${idx},'source',this.value)" onblur="if(!this.value)this.value='New Income';this.setAttribute('readonly',true)" onkeydown="if(event.key==='Enter')this.blur()"`} style="cursor:pointer;">
        ${srcExpired ? '<span class="expired-badge">Archived</span>' : ''}
        <label onclick="event.stopPropagation()" style="display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;font-size:11px;color:var(--text-hint);font-weight:500;">
          <input type="checkbox" ${src.isPeriodDriver ? 'checked' : ''} onchange="updateIncome(${idx},'isPeriodDriver',this.checked);refresh();" onclick="event.stopPropagation();" style="accent-color:var(--blue);width:14px;height:14px;">
