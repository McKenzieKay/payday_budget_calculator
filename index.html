<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payday Budget Calculator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f8f7f4;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.1);
    --border-strong: rgba(0,0,0,0.2);
    --text: #1a1a1a;
    --text-muted: #666;
    --text-hint: #999;
    --green-bg: #eaf3de;
    --green: #3b6d11;
    --green-dark: #27500a;
    --amber-bg: #faeeda;
    --amber: #854f0b;
    --blue-bg: #e6f1fb;
    --blue: #185fa5;
    --blue-dark: #0c447c;
    --red-bg: #fcebeb;
    --red: #a32d2d;
    --purple-bg: #eeedfe;
    --purple: #534ab7;
    --radius: 10px;
    --radius-sm: 6px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --surface: #242424;
      --border: rgba(255,255,255,0.1);
      --border-strong: rgba(255,255,255,0.2);
      --text: #f0f0f0;
      --text-muted: #aaa;
      --text-hint: #777;
      --green-bg: #173404;
      --green: #97c459;
      --green-dark: #c0dd97;
      --amber-bg: #412402;
      --amber: #ef9f27;
      --blue-bg: #042c53;
      --blue: #85b7eb;
      --blue-dark: #b5d4f4;
      --red-bg: #501313;
      --red: #f09595;
      --purple-bg: #26215c;
      --purple: #afa9ec;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  .tab-bar {
    display: flex;
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    padding: 0 1.5rem;
    gap: 0;
  }

  .tab-btn {
    font-size: 13px;
    font-weight: 500;
    padding: 10px 18px;
    border: none;
    background: none;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -0.5px;
    transition: color 0.15s;
  }

  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--blue); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .bills-table { width: 100%; border-collapse: collapse; }
  .bills-table th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-hint);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 10px 12px;
    border-bottom: 0.5px solid var(--border);
    background: var(--bg);
  }

  .bills-table td {
    padding: 8px 12px;
    border-bottom: 0.5px solid var(--border);
    font-size: 13px;
    vertical-align: middle;
  }

  .bills-table tr:last-child td { border-bottom: none; }
  .bills-table tr:hover td { background: var(--bg); }

  .bill-input {
    font-size: 13px;
    border: 0.5px solid transparent;
    border-radius: var(--radius-sm);
    padding: 4px 8px;
    background: transparent;
    color: var(--text);
    width: 100%;
  }

  .bill-input:hover { border-color: var(--border-strong); }
  .bill-input:focus { border-color: var(--blue); outline: none; background: var(--surface); }

  .bill-select {
    font-size: 13px;
    border: 0.5px solid transparent;
    border-radius: var(--radius-sm);
    padding: 4px 8px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    width: 100%;
  }

  .bill-select:hover { border-color: var(--border-strong); background: var(--surface); }
  .bill-select:focus { border-color: var(--blue); outline: none; background: var(--surface); }

  .bill-delete-btn {
    background: none;
    border: none;
    color: var(--text-hint);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    border-radius: 4px;
    line-height: 1;
  }

  .bill-delete-btn:hover { color: var(--red); background: var(--red-bg); }

  .add-bill-btn {
    margin: 1rem 0;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    font-weight: 500;
  }

  .add-bill-btn:hover { background: var(--blue-bg); color: var(--blue); border-color: var(--blue); }

  .bills-panel-wrap { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem; }

  .toggle-wrap { display: flex; align-items: center; gap: 6px; }
  .tog { width: 34px; height: 18px; border-radius: 9px; background: var(--border-strong); position: relative; cursor: pointer; flex-shrink: 0; transition: background 0.2s; border: none; padding: 0; }
  .tog.on { background: #378ADD; }
  .tog::after { content: ""; width: 14px; height: 14px; background: #fff; border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: left 0.2s; }
  .tog.on::after { left: 18px; }
  .tog-label { font-size: 12px; color: var(--text-muted); }
  .tog.on + .tog-label { color: var(--text); }

  .bills-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .income-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 8px;
    position: relative;
    overflow: visible;
  }

  .income-card.expired {
    opacity: 0.45;
  }

  .income-card[draggable="true"] { cursor: grab; }
  .income-card[draggable="true"]:active { cursor: grabbing; }
  .income-card.drag-over { border: 1.5px dashed var(--blue); background: var(--blue-bg); }
  .income-card.dragging { opacity: 0.4; }

  .income-card .income-chevron {
    font-size: 18px;
    color: var(--text-hint);
    line-height: 1;
    padding: 0 4px;
    transition: transform 0.2s;
    display: inline-block;
  }

  .income-card .income-expand.open ~ * .income-chevron,
  .income-card:has(.income-expand.open) .income-chevron { transform: rotate(180deg); }

  .expired-badge {
    font-size: 10px;
    color: var(--text-hint);
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    margin-left: 8px;
  }

  .income-row-main {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    align-items: center;
    gap: 1rem;
    padding: 12px 42px 12px 16px;
  }

  .income-source-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    border: none;
    background: transparent;
    outline: none;
    width: 100%;
    max-width: 33%;
  }

  .income-source-name:focus { outline: none; }

  .income-dots-wrap { position: absolute; top: 8px; right: 10px; }
  .income-dots-btn { background: none; border: none; color: var(--text-hint); cursor: pointer; font-size: 18px; padding: 2px 4px; border-radius: 4px; line-height: 1; }
  .income-dots-btn:hover { background: var(--bg); color: var(--text); }
  .income-dropdown { display: none; position: absolute; top: 100%; right: 0; background: var(--surface); border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); min-width: 100px; z-index: 50; overflow: hidden; }
  .income-dropdown.open { display: block; }
  .income-dropdown button { display: block; width: 100%; text-align: left; padding: 8px 14px; font-size: 13px; background: none; border: none; cursor: pointer; color: var(--red); }
  .income-dropdown button:hover { background: var(--red-bg); }

  .income-expand { display: none; border-top: 0.5px solid var(--border); padding: 16px; background: var(--bg); border-radius: 0 0 var(--radius) var(--radius); }
  .income-expand.open { display: block; }
  .income-expand-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem; }
  .income-field { display: flex; flex-direction: column; gap: 5px; }
  .income-field-label { font-size: 11px; font-weight: 600; color: var(--text-hint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .income-field select, .income-field input[type=date] { font-size: 13px; border: 0.5px solid var(--border-strong); border-radius: 6px; padding: 5px 8px; background: var(--surface); color: var(--text); width: 100%; }
  .income-pattern-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
  .income-hdr { font-size: 11px; font-weight: 600; color: var(--text-hint); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px; padding: 0 4px 0 16px; display: grid; grid-template-columns: 1fr 1fr auto; gap: 1rem; align-items: center; }



  header {
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    padding: 1.25rem 1.5rem;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  header h1 {
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
  }

  header p {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .header-stats {
    display: flex;
    gap: 1rem;
    align-items: center;
  }

  .stat-pill {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 0.5px solid var(--border-strong);
    color: var(--text-muted);
  }

  .stat-pill strong {
    color: #ffffff;
    font-weight: 600;
  }

  main { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 2rem;
  }

  .summary-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
  }

  .summary-card .label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  .summary-card .value {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
  }

  .summary-card .sub {
    font-size: 11px;
    color: var(--text-hint);
    margin-top: 3px;
  }

  .summary-card.green .value { color: var(--green); }
  .summary-card.blue .value  { color: var(--blue);  }
  .summary-card.amber .value { color: var(--amber); }

  .month-section { margin-bottom: 2.5rem; }

  .month-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.75rem;
    padding-left: 2px;
  }

  .period-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
  }

  .period-summary {
    display: grid;
    grid-template-columns: 5fr 100px 80px 80px auto;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.25rem 2rem 1.25rem;
    cursor: pointer;
    user-select: none;
    position: relative;
  }

  .period-summary:hover { background: var(--bg); }

  .period-date {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }

  .period-date .sub {
    font-size: 12px;
    color: var(--text-hint);
    font-weight: 400;
    margin-top: 3px;
  }

  .income-col {
    text-align: right;
  }

  .income-col .label, .bills-col .label {
    font-size: 11px;
    color: var(--text-hint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    margin-bottom: 3px;
  }

  .income-col .amount, .bills-col .amount {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .bills-col {
    text-align: right;
  }

  .pullout-badge {
    min-width: 110px;
    text-align: center;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 700;
  }

  .pullout-badge.available {
    background: var(--green-bg);
    color: var(--green-dark);
  }

  .pullout-badge.zero {
    background: var(--amber-bg);
    color: var(--amber);
    font-size: 12px;
    font-weight: 500;
  }

  .chevron {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--text-hint);
    cursor: pointer;
    white-space: nowrap;
  }

  .chevron-icon {
    font-size: 18px;
    line-height: 1;
    transition: transform 0.2s;
  }

  .period-card.open .chevron-icon { transform: rotate(180deg); }

  .period-detail {
    display: none;
    border-top: 0.5px solid var(--border);
    padding: 0;
  }

  .period-card.open .period-detail { display: block; }

  .detail-header {
    display: grid;
    grid-template-columns: 1fr auto;
    padding: 8px 1.25rem;
    background: var(--bg);
    font-size: 11px;
    font-weight: 600;
    color: var(--text-hint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .bill-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 0.75rem;
    padding: 10px 1.25rem;
    border-top: 0.5px solid var(--border);
    font-size: 13px;
  }

  .bill-row:first-of-type { border-top: none; }

  .bill-day {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--bg);
    border-radius: 4px;
    padding: 2px 7px;
    min-width: 36px;
    text-align: center;
  }

  .bill-name { color: var(--text); }

  .bill-amount {
    font-weight: 500;
    color: var(--text);
    text-align: right;
  }

  .bill-total-row {
    display: grid;
    grid-template-columns: 1fr auto;
    padding: 10px 1.25rem;
    border-top: 1px solid var(--border-strong);
    background: var(--bg);
    font-size: 13px;
    font-weight: 600;
  }

  .bill-total-row .total-label { color: var(--text-muted); }
  .bill-total-row .total-amount { color: var(--text); }

  .income-breakdown {
    display: flex;
    gap: 1.5rem;
    padding: 10px 1.25rem;
    border-top: 0.5px solid var(--border);
    background: var(--green-bg);
  }

  .income-item { font-size: 12px; color: var(--green); }
  .income-item strong { font-weight: 600; }

  .period-cover-note {
    font-size: 12px;
    color: var(--amber);
    padding: 10px 1.25rem;
    background: var(--amber-bg);
    border-top: 0.5px solid var(--border);
  }

  footer {
    text-align: center;
    padding: 2rem 1rem;
    font-size: 12px;
    color: var(--text-hint);
  }

  .archive-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 0.75rem 1.25rem;
    margin-bottom: 1.5rem;
    font-size: 13px;
    color: var(--text-muted);
  }

  .archive-banner strong { color: var(--text); }

  .archive-btn {
    font-size: 12px;
    padding: 5px 12px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .archive-btn:hover { background: var(--bg); }

  .balance-bar {
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    padding: 0.75rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  .balance-bar label {
    font-size: 13px;
    color: var(--blue);
    font-weight: 500;
    white-space: nowrap;
  }

  .balance-bar input[type="date"] {
    font-size: 13px;
    padding: 5px 10px;
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    height: 32px;
    width: 150px;
  }


  .balance-bar input[type="date"]   { width: 150px; }

  .balance-bar button {
    font-size: 13px;
    padding: 5px 14px;
    height: 32px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--blue);
    background: var(--blue);
    color: #fff;
    cursor: pointer;
    font-weight: 500;
  }

  .balance-bar button:hover { opacity: 0.88; }

  .balance-bar .reset-btn {
    background: transparent;
    color: var(--blue);
    border-color: var(--border-strong);
  }

  .balance-bar .save-btn {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
  }

  .balance-bar .save-btn:hover {
    opacity: 0.88;
  }

  .balance-bar .save-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .saved-badge {
    font-size: 11px;
    color: var(--green);
    font-weight: 500;
    display: none;
  }

  .balance-bar .hint {
    font-size: 11px;
    color: var(--blue);
    opacity: 0.7;
  }

  .period-card.updated-period > .period-summary {
    border-left: 3px solid var(--blue);
  }

  @media (max-width: 600px) {
    .period-summary {
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
    }
    .income-col { display: none; }
    .bills-col  { display: none; }
  }
  .baseline-box {
    margin-top: 10px;
    margin-bottom: 10px;
  }

  .baseline-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-left: 3px solid #a3c900;
    border-radius: 0 var(--radius) var(--radius) 0;
    overflow: hidden;
  }

  .baseline-card.shortfall {
    border-left-color: var(--red);
    border-color: rgba(162,45,45,0.25);
  }

  .bl-menu-wrap { position: relative; }
  .bl-dots { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--text-muted); padding: 2px 6px; border-radius: 4px; line-height: 1; }
  .bl-dots:hover { background: var(--bg); color: var(--text); }
  .bl-dropdown { display: none; position: absolute; top: 100%; right: 0; background: var(--surface); border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); min-width: 100px; z-index: 50; overflow: hidden; }
  .bl-dropdown.open { display: block; }
  .bl-dropdown button { display: block; width: 100%; text-align: left; padding: 8px 14px; font-size: 13px; background: none; border: none; cursor: pointer; color: var(--red); }
  .bl-dropdown button:hover { background: var(--red-bg); }

  .baseline-card.test-preview {
    border-left-color: #a3c900;
    border-color: rgba(163,201,0,0.25);
  }

  .baseline-card.test-preview .baseline-header {
    background: #e8ff4a;
    color: #3a4d00;
  }

  .baseline-header {
    padding: 8px 1.25rem;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    display: flex;
    align-items: center;
    gap: 6px;
    background: #e8ff4a;
    color: #3a4d00;
  }

  .baseline-card.shortfall .baseline-header {
    background: var(--red-bg);
    color: var(--red);
  }

  .baseline-row {
    display: grid;
    grid-template-columns: 5fr 100px 80px 80px auto;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.25rem;
  }

  .baseline-date {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }

  .baseline-date .sub {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 400;
    margin-top: 2px;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Payday Budget Calculator</h1>
  </div>
  <div class="header-stats" style="display:flex;align-items:center;">
    <div style="display:flex;align-items:center;height:30px;border:0.5px solid #000;border-radius:20px;overflow:hidden;">
      <div style="display:flex;align-items:center;padding:0 12px;gap:6px;height:100%;background:var(--surface);">
        <span style="font-size:11px;color:#000;letter-spacing:0.05em;text-transform:uppercase;user-select:none;">Buffer</span>
        <div style="display:flex;align-items:center;background:transparent;height:24px;padding:0 4px;gap:2px;">
          <span style="font-size:13px;color:var(--text-muted);user-select:none;">$</span>
          <input id="bufferInput" type="text" inputmode="numeric" value="0"
            style="width:52px;font-size:13px;font-weight:600;border:none;background:transparent;color:var(--text);padding:0;text-align:right;outline:none;"
            oninput="onBufferInput(this)" onblur="formatBufferInput(this)" onfocus="stripAmountInput(this)">
        </div>
      </div>
      <button onclick="saveBuffer()" style="font-size:10px;padding:0 12px;height:100%;border:none;border-left:0.5px solid #000;background:#fff;color:#000;cursor:pointer;font-weight:600;letter-spacing:0.03em;">Save</button>
    </div>
  </div>
</header>

<div class="balance-bar">
  <label>Update Balance</label>

  <span>v1.0.0</span>
  <button onclick="handleDownloadArchive()"
    style="font-size:11px;padding:4px 12px;border-radius:6px;border:0.5px solid var(--border-strong);background:var(--surface);color:var(--text-muted);cursor:pointer;">
    ↓ Download Archived Data
  </button>
</footer>

<script>
let BUFFER = 0;

let BILLS = [];

function daysBetween(a, b) {
  return Math.round((b - a) / 86400000);
}

function isExpired(item, dt) {
  if (!item.endDate) return false;
  const [ey, em, ed] = item.endDate.split("-").map(Number);
  return dt > new Date(ey, em-1, ed);
}

function hasStarted(item, dt) {
  if (!item.startDate) return true;
  const [sy, sm, sd] = item.startDate.split("-").map(Number);
  return dt >= new Date(sy, sm-1, sd);
}

function billsOnDate(dt) {
  const d = dt.getDate(), m = dt.getMonth() + 1;
  return BILLS.filter(b => {
    if (isExpired(b, dt)) return false;
    if (!hasStarted(b, dt)) return false;
    // Weekly: hits every 7 days from startDate
    if (b.freq === "weekly") {
      if (!b.startDate) return false;
      const [sy, sm, sd] = b.startDate.split("-").map(Number);
      const start = new Date(sy, sm-1, sd);
      const diff = Math.round((dt - start) / 86400000);
      return diff >= 0 && diff % 7 === 0;
    }
    // Biweekly: hits every 14 days from startDate
    if (b.freq === "biweekly") {
      if (!b.startDate) return false;
      const [sy, sm, sd] = b.startDate.split("-").map(Number);
      const start = new Date(sy, sm-1, sd);
      const diff = Math.round((dt - start) / 86400000);
      return diff >= 0 && diff % 14 === 0;
    }
    // One-time: only on the exact startDate
    if (b.freq === "one_time") {
      if (!b.startDate) return false;
      const [sy, sm, sd] = b.startDate.split("-").map(Number);
      return dt.getFullYear() === sy && dt.getMonth() + 1 === sm && dt.getDate() === sd;
    }
    // Annually: same day/month each year
    if (b.freq === "annually") {
      if (!b.days.includes(d)) return false;
      if (!b.startDate) return false;
      const startMonth = parseInt(b.startDate.split("-")[1]);
      return m === startMonth;
    }
    if (!b.days.includes(d)) return false;
    if (b.freq === "monthly" || b.freq === "bimonthly") return true;
    if (b.freq === "quarterly") {
      if (!b.startDate) return false;
      const [sy, sm, sd] = b.startDate.split("-").map(Number);
      if (dt.getDate() !== b.days[0]) return false;
      const monthsDiff = (dt.getFullYear() - sy) * 12 + (dt.getMonth() + 1 - sm);
      return monthsDiff >= 0 && monthsDiff % 3 === 0;
    }
    if (b.freq === "quarterly_may") return [5,8,11].includes(m);
    if (b.freq === "quarterly_jun") return [6,9,12].includes(m);
    if (b.freq === "quarterly_jul") return [7,10,1].includes(m);
    return false;
  });
}

// Build paydays through Jan 2027
function buildPaydays() {
  // Generate pay periods: every 14 days covering current month -1 through +5 months
  const now = new Date();
  const rangeStart = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const rangeEnd   = new Date(now.getFullYear(), now.getMonth() + 6, 1);

  const pdSet = new Set();

  // Collect all biweekly payday dates from income sources
  INCOME_SOURCES.forEach(src => {
    if (src.freq !== "biweekly" || !src.startDate) return;
    const [sy,sm,sd] = src.startDate.split("-").map(Number);
    const anchor = new Date(sy, sm-1, sd);
    let cur = new Date(anchor);
    // Rewind to range start
    while (cur < rangeStart) cur = new Date(cur.getTime() + 14 * 86400000);
    while (cur >= rangeStart) cur = new Date(cur.getTime() - 14 * 86400000);
    cur = new Date(cur.getTime() + 14 * 86400000);
    while (cur < rangeEnd) {
      pdSet.add(cur.toDateString());
      cur = new Date(cur.getTime() + 14 * 86400000);
    }
  });

  // Also collect weekly income paydays
  INCOME_SOURCES.forEach(src => {
    if (src.freq !== "weekly" || !src.startDate) return;
    const [sy,sm,sd] = src.startDate.split("-").map(Number);
    const anchor = new Date(sy, sm-1, sd);
    let cur = new Date(anchor);
    while (cur < rangeStart) cur = new Date(cur.getTime() + 7 * 86400000);
    while (cur >= rangeStart) cur = new Date(cur.getTime() - 7 * 86400000);
    cur = new Date(cur.getTime() + 7 * 86400000);
    while (cur < rangeEnd) {
      pdSet.add(cur.toDateString());
      cur = new Date(cur.getTime() + 7 * 86400000);
    }
  });

  // If no income sources defined, fall back to every-two-weeks from today
  if (pdSet.size === 0) {
    let cur = new Date(now);
    cur.setDate(1); // start of current month
    const end = new Date(now.getFullYear(), now.getMonth() + 6, 1);
    while (cur < end) {
      pdSet.add(cur.toDateString());
      cur = new Date(cur.getTime() + 14 * 86400000);
    }
  }

  return [...pdSet].map(s => new Date(s)).sort((a,b) => a-b);
}

function fmt(n) {
  return Math.round(n).toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
}

function ordinal(d) {
  if (d === 1 || d === 21 || d === 31) return d + "st";
  if (d === 2 || d === 22) return d + "nd";
  if (d === 3 || d === 23) return d + "rd";
  return d + "th";
}

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const FULL_MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

// No default override — user sets their own starting balance
const today = new Date();
const DEFAULT_OVERRIDE = null;

// Balance override state — starts as the default
let balanceOverride = null; // { date: Date, amount: number } or null
let testOverride = null;    // preview only — shown in test box, doesn't change current period

// Saved ground truth — persists across resets
let savedGroundTruth = null;

let savedBuffer = 1000;

function parseBufferVal(input) {
  return parseFloat(input.value.replace(/,/g, ""));
}

function onBufferInput(input) {
  const raw = input.value.replace(/,/g, "");
  const val = parseFloat(raw);

  // Reformat with commas while preserving cursor position
  const cursorPos = input.selectionStart;
  const oldLen = input.value.length;
  const commasBefore = (input.value.slice(0, cursorPos).match(/,/g) || []).length;

  const parts = raw.split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const formatted = parts.join(".");
  input.value = formatted;

  // Adjust cursor for added/removed commas
  const newCommasBefore = (formatted.slice(0, cursorPos).match(/,/g) || []).length;
  const newCursor = cursorPos + (newCommasBefore - commasBefore);
  input.setSelectionRange(newCursor, newCursor);

  if (!isNaN(val) && val >= 0) {
    BUFFER = val;
    refresh();
    if (savedGroundTruth) updateBaselineBox();
  }
}

function formatBufferInput(input) {
  const val = parseFloat(input.value.replace(/,/g, ""));
  if (!isNaN(val)) {
    input.value = val.toLocaleString("en-US");
    BUFFER = val;
    refresh();
    if (savedGroundTruth) updateBaselineBox();
  }
}

function previewBuffer() {
  const val = parseFloat(document.getElementById("bufferInput").value.replace(/,/g, ""));
  if (!isNaN(val) && val >= 0) {
    BUFFER = val;
    refresh();
    if (savedGroundTruth) updateBaselineBox();
  }
}

function saveBuffer() {
  const val = parseFloat(document.getElementById("bufferInput").value.replace(/,/g, ""));
  if (!isNaN(val) && val >= 0) {
    savedBuffer = val;
    BUFFER = val;
    document.getElementById("bufferInput").value = val.toLocaleString("en-US");
    refresh();
    if (savedGroundTruth) updateBaselineBox();
  }
}

function parseAmount(id) {
  return parseFloat(document.getElementById(id).value.replace(/,/g, "")) || 0;
}

function liveFormatAmount(el) {
  // Strip everything except digits and one decimal point
  let raw = el.value.replace(/[^0-9.]/g, "");
  // Keep only first decimal point
  const parts = raw.split(".");
  if (parts.length > 2) raw = parts[0] + "." + parts.slice(1).join("");
  // Format integer part with commas, preserve decimal as typed
  const dotIdx = raw.indexOf(".");
  const intPart = dotIdx >= 0 ? raw.slice(0, dotIdx) : raw;
  const decPart = dotIdx >= 0 ? raw.slice(dotIdx) : "";
  const formatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  el.value = formatted + decPart;
}

function formatAmountInput(el) {
  const val = parseFloat(el.value.replace(/,/g, ""));
  if (!isNaN(val) && val > 0) {
    el.value = Math.round(val).toLocaleString("en-US");
  }
}

function stripAmountInput(el) {
  el.value = el.value.replace(/,/g, "");
}

function applyBalanceUpdate() {
  const dateVal = document.getElementById("balanceDate").value;
  const amtVal  = parseAmount("balanceAmount");
  if (!dateVal || isNaN(amtVal)) {
    return;
  }
  const [y, m, d] = dateVal.split("-").map(Number);
  // testOverride drives the preview box; balanceOverride only affects periods AFTER
  testOverride = { date: new Date(y, m-1, d), amount: amtVal };
  balanceOverride = { date: new Date(y, m-1, d), amount: amtVal };
  refresh();
}

function saveBalance() {
  // If no test has been run yet, apply the current inputs first
  if (!balanceOverride) {
    const dateVal = document.getElementById("balanceDate").value;
    const amtVal  = parseAmount("balanceAmount");
    if (!dateVal || isNaN(amtVal)) {
      return;
    }
    const [y, m, d] = dateVal.split("-").map(Number);
    balanceOverride = { date: new Date(y, m-1, d), amount: amtVal };
    refresh();
  }
  savedGroundTruth = { ...balanceOverride };
  document.getElementById("saveBtn").disabled = true;
  // Reset amount input
  const amtInput = document.getElementById("balanceAmount");
  if (amtInput) amtInput.value = "";
  updateBaselineBox();
  setTimeout(() => {
    const box = document.getElementById("baselineBox");
      box.scrollIntoView({ behavior: "smooth", block: "start" });
  }, 50);
}

function deleteBaseline() {
  savedGroundTruth = null;
  balanceOverride = null;
  testOverride = null;
  document.getElementById("balanceAmount").value = "";
  refresh();
}

function renderBaselineContent(overrideData, period, isTest) {
  const card   = document.getElementById("baselineCard");
  const header = document.getElementById("baselineHeader");
  const row    = document.getElementById("baselineRow");
  if (!card || !header || !row) return;

  const dateStr = overrideData.date.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });

  // Collect bills from override date forward to next payday
  let billsRemaining = 0;
  const remainingBillsList = [];
  if (period) {
    let cur = new Date(overrideData.date);
    while (cur.getTime() < period.nextPayday.getTime()) {
      billsOnDate(cur).forEach(b => {
        billsRemaining += b.amt;
        remainingBillsList.push({ name: b.name, amt: b.amt, day: cur.getDate() });
      });
      cur = new Date(cur.getTime() + 86400000);
    }
  }

  const dontGoBelow = Math.ceil((billsRemaining + BUFFER) / 100) * 100;
  const lumpSum     = overrideData.amount - billsRemaining - BUFFER;
  const isShortfall = lumpSum < 0;

  if (isTest) {
    card.className = "baseline-card test-preview";
  } else {
    card.className = "baseline-card" + (isShortfall ? " shortfall" : "");
  }

  const accentColor = isTest ? "#3a4d00" : (isShortfall ? "var(--red)" : "#3a4d00");
  const accentBg    = isTest ? "#e8ff4a"  : (isShortfall ? "var(--red-bg)" : "#e8ff4a");

  const menuId = "blMenu_" + Date.now();
  const actionBtn = isTest
    ? ""
    : `<div class="bl-menu-wrap">
        <button class="bl-dots" onclick="event.stopPropagation();document.getElementById('${menuId}').classList.toggle('open');" aria-label="Options">&#8942;</button>
        <div class="bl-dropdown" id="${menuId}">
          <button onclick="event.stopPropagation();deleteBaseline();">Delete</button>
        </div>
      </div>`;

  const titleLabel = isTest ? "Test Preview —" : "Balance Saved —";
  const icon = isTest ? "ti-flask" : (isShortfall ? "ti-circle-x" : "ti-circle-check");

  header.style.display = "none";

  const badgeStyle = `background:${accentBg};color:${accentColor};padding:8px 14px;border-radius:6px;font-size:15px;font-weight:700;min-width:110px;text-align:center;`;

  const toggleDetail = () => {
    const detail = document.getElementById("baselineDetail");
    if (detail) {
      const open = detail.style.display !== "none";
      detail.style.display = open ? "none" : "block";
      const chev = document.getElementById("baselineChevron");
      if (chev) chev.textContent = open ? "▾" : "▴";
    }
  };

  row.style.cursor = "pointer";
  row.onclick = toggleDetail;

  const badgeBg = isTest ? "#e8ff4a" : isShortfall ? "var(--red-bg)" : "#e8ff4a";
  const badgeFg = isTest ? "#3a4d00" : isShortfall ? "var(--red)" : "#3a4d00";

  row.innerHTML = `
    <div class="period-date">
      Balance on ${dateStr}
      <div class="sub">Bills from this date forward</div>
    </div>
    <div class="bills-col">
      <div class="label">Lowest Limit</div>
      <div class="amount" style="color:var(--red)">${fmt(dontGoBelow)}</div>
    </div>
    <div class="income-col">
      <div class="label">Balance ${isTest ? "entered" : "saved"}</div>
      <div class="amount" style="color:${isTest ? "#3a4d00" : "#3a4d00"}">${fmt(overrideData.amount)}</div>
    </div>
    <div class="bills-col">
      <div class="label">Bills remaining</div>
      <div class="amount">${fmt(billsRemaining)}</div>
    </div>
    <div style="background:${badgeBg};color:${badgeFg};min-width:110px;text-align:center;padding:8px 14px;border-radius:6px;font-size:15px;font-weight:700;">${fmt(lumpSum)}</div>
  `;

  // Inject three-dot menu into top-right of card
  const existingMenu = card.querySelector(".bl-menu-wrap");
  if (existingMenu) existingMenu.remove();
  if (actionBtn) {
    const menuWrap = document.createElement("div");
    menuWrap.style.cssText = "position:absolute;top:10px;right:12px;";
    menuWrap.innerHTML = actionBtn;
    card.style.position = "relative";
    card.appendChild(menuWrap);
  }

  // Close dropdown when clicking outside
  document.addEventListener("click", () => {
    document.querySelectorAll(".bl-dropdown.open").forEach(d => d.classList.remove("open"));
  }, { once: false });

  // Build expandable bill detail
  const billRows = remainingBillsList.map(b => `
    <div class="bill-row">
      <span class="bill-day">${ordinal(b.day)}</span>
      <span class="bill-name">${b.name}</span>
      <span class="bill-amount">${fmt(b.amt)}</span>
    </div>`).join("");

  // Remove old detail if exists, then append fresh
  const oldDetail = document.getElementById("baselineDetail");
  if (oldDetail) oldDetail.remove();

  const detail = document.createElement("div");
  detail.id = "baselineDetail";
  detail.style.display = "none";
  detail.style.borderTop = "0.5px solid var(--border)";
  detail.innerHTML = `
    <div class="detail-header" style="display:grid;grid-template-columns:1fr auto;padding:8px 1.25rem;background:var(--bg);font-size:11px;font-weight:600;color:var(--text-hint);text-transform:uppercase;letter-spacing:0.06em;">
      <span>Bills remaining this period</span><span>Amount</span>
    </div>
    ${billRows}
    <div class="bill-total-row">
      <span class="total-label">Total</span>
      <span class="total-amount">${fmt(billsRemaining)}</span>
    </div>`;

  card.appendChild(detail);

}

function updateBaselineBox() {
  refresh(); // renderPeriods will inject and populate the box
}

function resetBalance() {
  // Reset buffer to saved value
  BUFFER = savedBuffer;
  document.getElementById("bufferInput").value = savedBuffer.toLocaleString("en-US");

  // Reset to saved ground truth if one exists, otherwise original
  if (savedGroundTruth) {
    balanceOverride = { ...savedGroundTruth };
    const dateStr = savedGroundTruth.date.toISOString().slice(0,10);
    document.getElementById("balanceDate").value = dateStr;
    document.getElementById("balanceAmount").value = Math.round(savedGroundTruth.amount).toLocaleString("en-US");
  } else {
    balanceOverride = null;
    testOverride = null;
    document.getElementById("balanceAmount").value = "";
  }
  document.getElementById("saveBtn").disabled = true;
  refresh();
  if (savedGroundTruth) updateBaselineBox();
}

function computePeriods() {
  const paydays = buildPaydays();
  const results = [];

  // Two-pass approach:
  // Pass 1: run the default scenario (DEFAULT_OVERRIDE) for ALL periods
  // Pass 2: from the period AFTER the user override, replace balance with user's amount

  const userOverride = balanceOverride || null;

  // Build default periods using DEFAULT_OVERRIDE
  // If no starting override exists, use 0
  let balance = DEFAULT_OVERRIDE ? DEFAULT_OVERRIDE.amount : 0;
  let defaultApplied = false;

  // We need the default bills/income for every period regardless
  const allPeriods = [];
  for (let i = 0; i < paydays.length - 1; i++) {
    const pd = paydays[i];
    const nextPd = paydays[i+1];
    if (pd.getFullYear() > new Date().getFullYear() + 1) break;

    const days = daysBetween(pd, nextPd);
    let totalIn = 0, totalBills = 0;
    const periodBills = [];

    // Default countFrom: DEFAULT_OVERRIDE applies to first period only
    let countFrom = new Date(pd);
    if (!defaultApplied && DEFAULT_OVERRIDE && DEFAULT_OVERRIDE.date.getTime() < nextPd.getTime()) {
      defaultApplied = true;
      countFrom = DEFAULT_OVERRIDE && DEFAULT_OVERRIDE.date.getTime() > pd.getTime() ? new Date(DEFAULT_OVERRIDE.date) : new Date(pd);
    }

    let cur = new Date(countFrom);
    while (cur < nextPd) {
      const inc      = incomeOnDate(cur);
      const dayBills = billsOnDate(cur);
      const billTotal = dayBills.reduce((s, b) => s + b.amt, 0);
      totalIn    += inc;
      totalBills += billTotal;
      dayBills.forEach(b => periodBills.push({ ...b, dueDay: cur.getDate() }));
      cur = new Date(cur.getTime() + 86400000);
    }

    const yourPay = Array.from({length: daysBetween(countFrom, nextPd)}, (_, k) => {
      return incomeOnDate(new Date(countFrom.getTime() + k * 86400000));
    }).reduce((s, v) => s + v, 0);

    const partner = 0; // now part of incomeOnDate

    const lumpSum    = Math.max(0, balance + totalIn - totalBills - BUFFER);
    const endBalance = balance + totalIn - totalBills - lumpSum;

    allPeriods.push({ pd, nextPd, days, balance, totalIn, totalBills,
      yourPay, partner, lumpSum, endBalance, countFrom,
      periodBills: periodBills.sort((a,b) => a.dueDay - b.dueDay) });

    balance = endBalance;
  }

  // Now build final results — override kicks in only from the period AFTER override date
  let userApplied = false;
  let runningBalance = null; // will be set from allPeriods[0].balance until override kicks in

  for (let i = 0; i < allPeriods.length; i++) {
    const p = allPeriods[i];
    const { pd, nextPd, days } = p;

    const overrideInThisPeriod = userOverride && !userApplied &&
      userOverride.date.getTime() >= pd.getTime() &&
      userOverride.date.getTime() < nextPd.getTime();
    const useUserBalance = userOverride && userApplied;

    let totalIn    = p.totalIn;
    let totalBills = p.totalBills;
    let yourPay    = p.yourPay;
    let partner    = p.partner;
    let countFrom  = new Date(p.countFrom);
    let periodBills = p.periodBills;
    let isUpdatedPeriod = false;

    // If user balance is active (period after override), recalculate from period start
    if (useUserBalance) {
      totalIn = 0; totalBills = 0; yourPay = 0; partner = 0;
      const freshBills = [];
      let cur = new Date(pd);
      while (cur < nextPd) {
        const inc      = incomeOnDate(cur);
        const dayBills = billsOnDate(cur);
        const billTotal = dayBills.reduce((s, b) => s + b.amt, 0);
        totalIn    += inc;
        totalBills += billTotal;
        yourPay    += inc;
        dayBills.forEach(b => freshBills.push({ ...b, dueDay: cur.getDate() }));
        cur = new Date(cur.getTime() + 86400000);
      }
      countFrom   = new Date(pd);
      periodBills = freshBills.sort((a,b) => a.dueDay - b.dueDay);
      isUpdatedPeriod = true;
    }

    // Balance to use for this period
    const bal = (runningBalance !== null) ? runningBalance : p.balance;
    const lumpSum    = Math.max(0, bal + totalIn - totalBills - BUFFER);
    const endBalance = bal + totalIn - totalBills - lumpSum;

    results.push({
      payday: pd, nextPayday: nextPd, start: bal,
      yourPay, partner, totalIn, totalBills, lumpSum,
      days, isUpdatedPeriod, countFrom, periodBills,
    });

    if (overrideInThisPeriod) {
      // Count bills from override date to end of this period
      let billsFromOverride = 0;
      let cur2 = new Date(userOverride.date);
      while (cur2.getTime() < nextPd.getTime()) {
        billsFromOverride += billsOnDate(cur2).reduce((s, b) => s + b.amt, 0);
        cur2 = new Date(cur2.getTime() + 86400000);
      }
      const userLump = Math.max(0, userOverride.amount - billsFromOverride - BUFFER);
      runningBalance = userOverride.amount - billsFromOverride - userLump;
      userApplied = true;
    } else {
      runningBalance = endBalance;
    }
  }
  return results;
}
